<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #1a1a2e;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh; gap: 40px;
  font-family: 'Outfit', sans-serif;
  padding: 60px 20px;
}
.label { color: rgba(255,255,255,.4); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
.share-card {
  width: 480px;
  background: linear-gradient(145deg, #0e0525 0%, #1e0d48 55%, #0d1a3a 100%);
  border-radius: 24px;
  padding: 44px 40px 40px;
  text-align: center;
  color: #fff;
  position: relative;
  overflow: hidden;
}
.share-card::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% -10%, rgba(110,78,214,.5) 0%, transparent 65%);
  pointer-events: none;
}
.sac-logo {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; margin-bottom: 32px;
  font-size: 15px; font-weight: 700; letter-spacing: -0.01em;
  color: rgba(255,255,255,.9); position: relative;
}
.sac-name {
  font-size: 28px; font-weight: 800; letter-spacing: -0.02em;
  color: #fff; margin-bottom: 6px; position: relative;
}
.sac-subtitle {
  font-size: 13px; font-weight: 500; color: rgba(255,255,255,.5);
  letter-spacing: 0.06em; text-transform: uppercase;
  margin-bottom: 36px; position: relative;
}
.sac-badges {
  display: flex; justify-content: center; gap: 16px;
  margin-bottom: 36px; position: relative;
}
.sac-badge {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.sac-badge-circle {
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  box-shadow: 0 0 0 3px rgba(255,255,255,.2), 0 8px 24px rgba(110,78,214,.5);
}
.sac-badge-circle::after {
  content: '✓';
  position: absolute; bottom: -3px; right: -3px;
  width: 22px; height: 22px; border-radius: 50%;
  background: #22c55e; border: 2px solid #0e0525;
  font-size: 11px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
}
.sac-badge-name {
  font-size: 10px; font-weight: 600; color: rgba(255,255,255,.7);
  text-align: center; line-height: 1.3; letter-spacing: 0.01em;
}
.sac-url {
  font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
  color: rgba(255,255,255,.35); text-transform: lowercase;
