<style>
/* ═══════════════════════════════════════════════════════════
   1. DESIGN TOKENS (CSS Custom Properties)
   Copied verbatim from index.html — FamilyForce Design System v2
   ═══════════════════════════════════════════════════════════ */
:root {
  /* Color: Surface */
  --bg: #FAFAFA;
  --surface: #FFFFFF;
  --elevated: #F4F0FC;

  /* Color: Border */
  --border: #E5E2EC;
  --border-light: #EDEBF2;

  /* Color: Text */
  --text: #1D1D1F;
  --text-mid: #5C5960;
  --text-dim: #8A879A;
  --text-ghost: #C2BFD0;

  /* Color: Brand purple (was terracotta — variable name kept for compat) */
  --terra: #6E4ED6;
  --terra-dark: #5B3CC4;    /* AA contrast-safe for small text */
  --terra-bright: #7C5CFC;
  --terra-glow: rgba(110, 78, 214, 0.06);

  /* Color: Semantic */
  --focus-ring: 0 0 0 3px rgba(110, 78, 214, 0.4);
  --selection: rgba(110, 78, 214, 0.15);

  /* Typography: Font stacks */
  --sans: 'Outfit', system-ui, -apple-system, sans-serif;
  --serif: 'Instrument Serif', Georgia, serif;

  /* Spacing: Responsive tokens (overridden at breakpoints) */
  --space-page-x: clamp(28px, 5vw, 64px);
  --space-section-y: 120px;
  --space-section-y-lg: 160px;
  --space-stack-lg: 48px;
  --space-stack-md: 32px;
  --space-stack-sm: 20px;
  --space-grid-gap: 20px;
  --space-card-x: 24px;
  --space-card-y: 32px;

  /* Radius */
  --radius-pill: 100px;
  --radius-container: 20px;
  --radius-card: 16px;
  --radius-input: 10px;

  /* Motion */
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --duration: 0.5s;
  --reveal-duration: 1.1s;
}


/* ═══════════════════════════════════════════════════════════
   2. RESET & BASE
   ═══════════════════════════════════════════════════════════ */
*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
}

@media (prefers-reduced-motion: no-preference) {
  html:focus-within {
    scroll-behavior: smooth;
  }
}

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  line-height: 1.5;
  min-height: 100vh;
  min-height: 100svh;
}

::selection {
  background: var(--selection);
  color: var(--text);
}

img { display: block; max-width: 100%; }
svg { max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }

@font-face { font-family: 'Outfit'; font-display: swap; src: local('Outfit'); }
@font-face { font-family: 'Instrument Serif'; font-display: swap; src: local('Instrument Serif'); }


/* ═══════════════════════════════════════════════════════════
   3. FOCUS MANAGEMENT (WCAG 2.1 AA: 2.4.7)
   ═══════════════════════════════════════════════════════════ */
:focus {
  outline: 2px solid var(--terra);
  outline-offset: 2px;
}

:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
  border-radius: 4px;
}

:focus:not(:focus-visible) {
  outline: none;
  box-shadow: none;
}

.btn-primary:focus-visible,
.btn-secondary:focus-visible {
  border-radius: var(--radius-pill);
}

.answer-card:focus-visible {
  border-radius: 12px;
  outline: none;
  box-shadow: var(--focus-ring);
}


/* ═══════════════════════════════════════════════════════════
   4. LAYOUT PRIMITIVES
   ═══════════════════════════════════════════════════════════ */
.wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 max(var(--space-page-x), env(safe-area-inset-left, 0));
  padding-right: max(var(--space-page-x), env(safe-area-inset-right, 0));
}


/* ═══════════════════════════════════════════════════════════
   5. TYPOGRAPHY CLASSES
   ═══════════════════════════════════════════════════════════ */
.label {
  font-weight: 600;
  font-size: 10.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--terra-dark);
}


/* ═══════════════════════════════════════════════════════════
   6. BUTTONS
   ═══════════════════════════════════════════════════════════ */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 18px 42px;
  background: var(--terra);
  color: #FFFFFF;
  border: none;
  border-radius: var(--radius-pill);
  font-size: 14.5px;
  font-weight: 600;
  letter-spacing: 0.015em;
  transition: background-color var(--duration) var(--ease),
              transform var(--duration) var(--ease),
              box-shadow var(--duration) var(--ease);
  position: relative;
  overflow: hidden;
  min-height: 48px;
}

.btn-primary::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent 60%);
  opacity: 0;
  transition: opacity 0.4s ease;
}

.btn-primary:active {
  background: #4A2EA8;
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(110, 78, 214, 0.12);
}

.btn-primary:disabled,
.btn-primary[aria-disabled="true"] {
  opacity: 0.4;
  pointer-events: none;
  cursor: not-allowed;
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 17px 34px;
  background: transparent;
  color: var(--text-mid);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  font-size: 14.5px;
  font-weight: 500;
  transition: border-color 0.4s ease, color 0.4s ease, background-color 0.4s ease;
  min-height: 48px;
}

.btn-secondary:active {
  border-color: var(--terra-dark);
  color: var(--terra-dark);
  background: var(--terra-glow);
}

.btn-secondary:disabled {
  opacity: 0.35;
  pointer-events: none;
}

@media (hover: hover) {
  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 20px 60px rgba(110, 78, 214, 0.18),
                0 0 0 1px rgba(110, 78, 214, 0.15);
    background: var(--terra-dark);
  }
  .btn-primary:hover::before { opacity: 1; }

  .btn-secondary:hover {
    border-color: var(--terra);
    color: var(--terra);
  }
}


/* ═══════════════════════════════════════════════════════════
   7. QUIZ NAV (minimal: logo + save & exit)
   ═══════════════════════════════════════════════════════════ */
.quiz-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(250, 250, 250, 0.92);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--border);
  padding-top: env(safe-area-inset-top, 0);
}

.quiz-nav-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 64px;
  padding: 0 var(--space-page-x);
}

/* Logo */
.logo {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 20px;
  letter-spacing: -0.02em;
  font-weight: 600;
  border-radius: 6px;
}

.logo-f { color: var(--text); }
.logo-s { color: var(--terra); }

.logo:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
  border-radius: 6px;
}

/* Save & Exit button */
.btn-save-exit {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: none;
  color: var(--text-mid);
  font-size: 13.5px;
  font-weight: 500;
  padding: 10px 4px;
  min-height: 44px;
  border-radius: 6px;
  transition: color 0.3s ease;
  cursor: pointer;
  text-decoration: none;
}

.btn-save-exit:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
  border-radius: 6px;
}

@media (hover: hover) {
  .btn-save-exit:hover { color: var(--terra); }
}


/* ═══════════════════════════════════════════════════════════
   8. QUIZ SHELL
   ═══════════════════════════════════════════════════════════ */
.quiz-main {
  min-height: calc(100vh - 64px);
  min-height: calc(100svh - 64px);
  padding: 40px 0 calc(48px + env(safe-area-inset-bottom, 0));
  display: flex;
  flex-direction: column;
}

.quiz-container {
  max-width: 560px;
  margin: 0 auto;
  width: 100%;
  padding: 0 var(--space-page-x);
  flex: 1;
  display: flex;
  flex-direction: column;
}


/* ═══════════════════════════════════════════════════════════
   9. PROGRESS BAR
   ═══════════════════════════════════════════════════════════ */
.progress-section {
  margin-bottom: 36px;
}

.progress-label-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 10px;
}

.progress-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
}

.progress-count {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-dim);
}

.progress-track {
  height: 8px;
  background: #E5E2EC;
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: #6E4ED6;
  border-radius: 4px;
  transition: width 0.4s ease;
  will-change: width;
}

@media (prefers-reduced-motion: reduce) {
  .progress-fill {
    transition: none !important;
  }
}


/* ═══════════════════════════════════════════════════════════
   10. QUESTION DISPLAY
   ═══════════════════════════════════════════════════════════ */
.question-section {
  flex: 1;
}

.question-number-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--terra-dark);
  margin-bottom: 14px;
}

.question-text {
  font-size: 15px;
  font-weight: 700;
  line-height: 1.5;
  color: var(--text);
  margin-bottom: 24px;
}


/* ═══════════════════════════════════════════════════════════
   11. ANSWER CARDS
   ═══════════════════════════════════════════════════════════ */
.answers-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 32px;
}

/* Visually hide the real radio input but keep it accessible */
.answer-card input[type="radio"] {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
  pointer-events: none;
}

.answer-card {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--surface);
  border: 1.5px solid #E5E2EC;
  border-radius: 12px;
  padding: 16px;
  min-height: 52px;
  font-size: 14px;
  font-weight: 400;
  color: var(--text);
  cursor: pointer;
  transition: border-color 0.25s ease, background-color 0.25s ease, color 0.25s ease;
  position: relative;
  user-select: none;
  -webkit-user-select: none;
}

/* Radio circle indicator */
.answer-indicator {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1.5px solid #C2BFD0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.25s ease, background-color 0.25s ease;
  background: transparent;
}

.answer-indicator svg {
  display: none;
}

.answer-letter {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--elevated);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  transition: background-color 0.25s ease, color 0.25s ease;
}

.answer-text {
  flex: 1;
  line-height: 1.45;
}

/* ── SELECTED STATE ── */
.answer-card.is-selected {
  background: #1D1D1F;
  color: #FFFFFF;
  border-color: #1D1D1F;
}

.answer-card.is-selected .answer-indicator {
  background: var(--terra);
  border-color: var(--terra);
}

.answer-card.is-selected .answer-indicator svg.icon-check-selected {
  display: block;
}

.answer-card.is-selected .answer-letter {
  background: rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.7);
}

/* ── CORRECT STATE (post-submit) ── */
.answer-card.is-correct {
  background: #E8F5E9;
  border-color: #2E7D32;
  color: var(--text);
  cursor: default;
  pointer-events: none;
}

.answer-card.is-correct .answer-indicator {
  background: #2E7D32;
  border-color: #2E7D32;
}

.answer-card.is-correct .answer-indicator svg.icon-check-correct {
  display: block;
}

.answer-card.is-correct .answer-letter {
  background: rgba(46,125,50,0.12);
  color: #2E7D32;
}

/* ── WRONG STATE (post-submit) ── */
.answer-card.is-wrong {
  background: #FFEBEE;
  border-color: #E53935;
  color: var(--text);
  cursor: default;
  pointer-events: none;
}

.answer-card.is-wrong .answer-indicator {
  background: #E53935;
  border-color: #E53935;
}

.answer-card.is-wrong .answer-indicator svg.icon-wrong {
  display: block;
}

.answer-card.is-wrong .answer-letter {
  background: rgba(229,57,53,0.1);
  color: #E53935;
}

/* ── NEUTRAL (post-submit, not selected, not correct) ── */
.answer-card.is-neutral {
  opacity: 0.55;
  cursor: default;
  pointer-events: none;
}

/* Hover — pointer devices only, not when reviewed */
@media (hover: hover) {
  .answer-card:not(.is-selected):not(.is-correct):not(.is-wrong):not(.is-neutral):hover {
    border-color: var(--terra);
    background: var(--elevated);
  }

  .answer-card:not(.is-selected):not(.is-correct):not(.is-wrong):not(.is-neutral):hover .answer-indicator {
    border-color: var(--terra);
  }
}


/* ═══════════════════════════════════════════════════════════
   12. NAVIGATION ROW
   ═══════════════════════════════════════════════════════════ */
.quiz-nav-row {
  display: flex;
  gap: 12px;
  padding-bottom: env(safe-area-inset-bottom, 0);
}

.quiz-nav-row .btn-secondary,
.quiz-nav-row .btn-primary {
  flex: 1;
}


/* ═══════════════════════════════════════════════════════════
   13. RESPONSIVE: COMPACT (≤ 899px)
   ═══════════════════════════════════════════════════════════ */
@media (max-width: 899px) {
  :root {
    --space-section-y: 80px;
    --radius-container: 16px;
  }

  .quiz-main {
    padding: 32px 0 calc(40px + env(safe-area-inset-bottom, 0));
  }

  .progress-section {
    margin-bottom: 28px;
  }
}


/* ═══════════════════════════════════════════════════════════
   14. RESPONSIVE: COMPACT NARROW (≤ 480px)
   ═══════════════════════════════════════════════════════════ */
@media (max-width: 480px) {
  :root {
    --space-page-x: 20px;
    --radius-container: 12px;
    --radius-card: 12px;
  }

  .quiz-nav-inner {
    height: 56px;
    padding: 0 20px;
  }

  .quiz-main {
    padding: 24px 0 calc(32px + env(safe-area-inset-bottom, 0));
  }

  .progress-section {
    margin-bottom: 24px;
  }

  .question-text {
    font-size: 15px; /* slightly larger on mobile per spec */
  }

  .answer-card {
    padding: 14px;
    gap: 12px;
  }

  .answers-group {
    gap: 8px;
    margin-bottom: 24px;
  }

  .quiz-nav-row .btn-primary,
  .quiz-nav-row .btn-secondary {
    min-height: 54px;
    font-size: 14px;
  }

  .logo { font-size: 18px; }
  .btn-save-exit { font-size: 13px; }
}


/* ═══════════════════════════════════════════════════════════
   15. REDUCED MOTION
   ═══════════════════════════════════════════════════════════ */
@media (prefers-reduced-motion: reduce) {
  .btn-primary,
  .btn-nav {
    transition-property: background-color, box-shadow !important;
  }

  .answer-card {
    transition: none !important;
  }

  .answer-indicator {
    transition: none !important;
  }
}


/* ═══════════════════════════════════════════════════════════
   16. UTILITY
   ═══════════════════════════════════════════════════════════ */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* Question transition */
.question-section {
  position: relative;
}

.question-slide {
  animation: slideIn 0.25s var(--ease) both;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateX(18px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.question-slide-back {
  animation: slideInBack 0.25s var(--ease) both;
}

@keyframes slideInBack {
  from {
    opacity: 0;
    transform: translateX(-18px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .question-slide,
  .question-slide-back {
    animation: none !important;
  }
}

<!-- Skip link (WCAG 2.4.1) -->
<a href="#quiz-content" class="sr-only" style="position:absolute;top:-100px;left:16px;background:var(--terra);color:#fff;padding:12px 24px;border-radius:8px;z-index:9999;font-weight:600;transition:top .2s;width:auto;height:auto;clip:auto;overflow:visible;white-space:nowrap" id="skip-link">Skip to quiz</a>
<style>#skip-link:focus{top:16px}</style>


<!-- ═══════════════════════════════════════════════════════════
     NAVIGATION — Minimal: logo + Save & Exit
     ═══════════════════════════════════════════════════════════ -->
<header class="quiz-nav" role="banner">
  <div class="quiz-nav-inner">
    <!-- Logo: links to homepage -->
    <a href="/" class="logo" aria-label="FamilyForce — Return to homepage">
      <svg width="13" height="15" viewBox="0 0 14 16" fill="none" aria-hidden="true">

      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">

      </svg>
    </button>

<!-- ═══════════════════════════════════════════════════════════
     MAIN QUIZ CONTENT
     ═══════════════════════════════════════════════════════════ -->
<main class="quiz-main" id="quiz-content" aria-label="Quiz: The Screen Time Playbook">
  <div class="quiz-container">

    <!-- PROGRESS BAR -->
    <section class="progress-section" aria-label="Quiz progress">
      <div class="progress-label-row">
        <span class="progress-title" id="progress-quiz-title">Screen Time Playbook Quiz</span>
        <span class="progress-count" id="progress-count" aria-live="polite" aria-atomic="true">1 of 10</span>
      </div>
      <div class="progress-track">
        <div
          class="progress-fill"
          id="progress-fill"
          role="progressbar"
          aria-valuenow="10"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-label="Quiz progress"
          style="width: 10%"
        ></div>
      </div>
    </section>

    <!-- QUESTION + ANSWERS -->
    <section class="question-section" id="question-section" aria-label="Current question">
      <!-- Rendered by JS -->
    </section>

    <!-- NAVIGATION ROW -->
    <nav class="quiz-nav-row" aria-label="Question navigation">
      <button
        class="btn-secondary"
        id="btn-back"
        aria-label="Go to previous question"
        disabled
      >
        ← Back
      </button>
      <button
        class="btn-primary"
        id="btn-next"
        aria-label="Go to next question"
      >
        Next →
      </button>
    </nav>

  </div>
</main>


<!-- ═══════════════════════════════════════════════════════════
     JAVASCRIPT — Quiz Engine
     ═══════════════════════════════════════════════════════════ -->
<script>
'use strict';

/* ─── QUIZ DATA: 10 screen time playbook questions ─── */
const QUESTIONS = [
  {
    text: "What does the research recommend for passive screen use in the first 18 months?",
    options: [
      { letter: "A", text: "Limit to 30 minutes per day of high-quality content like Ms. Rachel" },
      { letter: "B", text: "Avoid entirely — the exception is video calls where a real person responds in real time" },
      { letter: "C", text: "Background TV is fine as long as it's adult content, not children's programming" },
      { letter: "D", text: "One hour per day is acceptable if a parent is in the room" }
    ],
    correct: 1   // B
  },
  {
    text: "What is the 'video deficit effect'?",
    options: [
      { letter: "A", text: "Young children get addicted to screens faster than older children" },
      { letter: "B", text: "Educational content on screens is less effective than the same content in print" },
      { letter: "C", text: "Screen time reduces attention span in children under age 3" },
      { letter: "D", text: "Young children learn significantly less from passive video than from a live person — the brain is still building the ability to learn from 2D images" }
    ],
    correct: 3   // D
  },
  {
    text: "A 2011 study showed kids who watched 9 minutes of SpongeBob scored worse on executive function tests than kids who watched Caillou. What caused the difference?",
    options: [
      { letter: "A", text: "SpongeBob contains mildly aggressive themes that increase stress arousal" },
      { letter: "B", text: "Pacing — SpongeBob averages a scene change every 11 seconds; fast-paced content primes the brain for passive stimulation" },
      { letter: "C", text: "Screen brightness — SpongeBob's animation is more saturated and visually intense" },
      { letter: "D", text: "Caillou models problem-solving; SpongeBob lacks any educational intent" }
    ],
    correct: 1   // B
  },
  {
    text: "A parent consistently uses screens to stop tantrums. A 2024 study found this reliably predicts:",
    options: [
      { letter: "A", text: "Faster resolution over time as the child learns to self-soothe" },
      { letter: "B", text: "Poorer anger and frustration management — the child never completes the emotional regulation learning" },
      { letter: "C", text: "Stronger attachment, as the child associates comfort with the parent" },
      { letter: "D", text: "No long-term effect — occasional screen-soothing is harmless" }
    ],
    correct: 1   // B
  },
  {
    text: "Background TV — when adult shows play in a room with a toddler — has been shown to:",
    options: [
      { letter: "A", text: "Reduce the parent's speaking to the child by approximately 770 words per hour" },
      { letter: "B", text: "Have no effect on children who don't appear to be watching" },
      { letter: "C", text: "Increase vocabulary as children absorb adult language" },
      { letter: "D", text: "Only affect children when the content is aimed at them" }
    ],
    correct: 0   // A
  },
  {
    text: "Why does the book recommend a 60-minute screen-free window before bed? It's not blue light — it's:",
    options: [
      { letter: "A", text: "Cognitive stimulation making sleep-story transitions impossible" },
      { letter: "B", text: "Screen brightness disrupting the circadian clock independently of content" },
      { letter: "C", text: "Arousal — the show activates the sympathetic nervous system, and the nervous system needs time to come down" },
      { letter: "D", text: "Habit formation — children who watch before bed start expecting it nightly" }
    ],
    correct: 2   // C
  },
  {
    text: "Your 2-year-old wants to watch the same Ms. Rachel episode for the 10th time. What does the research say?",
    options: [
      { letter: "A", text: "Introduce something new — repetition past 3–4 viewings offers no additional learning" },
      { letter: "B", text: "Allow it — for toddlers, repetition builds comprehension before it builds boredom" },
      { letter: "C", text: "Co-watch to add new context and make repeated viewing more educational" },
      { letter: "D", text: "Use it as a signal they're ready for more advanced content" }
    ],
    correct: 1   // B
  },
  {
    text: "What makes a video call with grandma developmentally different from YouTube — even for a 12-month-old?",
    options: [
      { letter: "A", text: "Familiar faces trigger oxytocin, which improves attention and learning" },
      { letter: "B", text: "Contingency — a real person responds to what the child does in real time" },
      { letter: "C", text: "Video calls are slower-paced and easier for the developing brain to process" },
      { letter: "D", text: "The emotional warmth of a familiar voice improves content retention" }
    ],
    correct: 1   // B
  },
  {
    text: "Research shows parental changes to screen habits produce measurable improvements in child outcomes in:",
    options: [
      { letter: "A", text: "Weeks — the effects are malleable and respond quickly to intentional changes" },
      { letter: "B", text: "6–12 months — development takes sustained effort to shift" },
      { letter: "C", text: "2–3 years — once patterns are set, the window for change is largely closed" },
      { letter: "D", text: "It depends entirely on the age at which changes are made" }
    ],
    correct: 0   // A
  },
  {
    text: "The book calls it the 'single highest-leverage action' — ten seconds per platform. What is it?",
    options: [
      { letter: "A", text: "Setting a daily time limit using parental controls" },
      { letter: "B", text: "Turning off autoplay on every device and platform" },
      { letter: "C", text: "Replacing entertainment apps with educational ones" },
      { letter: "D", text: "Removing fast-paced shows from the playlist" }
    ],
    correct: 1   // B
  }
];

/* ─── STATE ─── */
const TOTAL = QUESTIONS.length;
let currentIndex = 0;         // 0-based question index
let selectedOption = null;    // index of selected option this question
let reviewed = false;         // has this question been submitted/revealed?
let answers = new Array(TOTAL).fill(null);  // user's chosen option per question
let direction = 'forward';    // for slide animation

/* ─── DOM REFS ─── */
const progressFill   = document.getElementById('progress-fill');
const progressCount  = document.getElementById('progress-count');
const questionSection = document.getElementById('question-section');
const btnBack        = document.getElementById('btn-back');
const btnNext        = document.getElementById('btn-next');
const btnSaveExit    = document.getElementById('btn-save-exit');

/* ─── SVG ICONS ─── */
const SVG_CHECK_SELECTED = `<svg class="icon-check-selected" width="12" height="12" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2.5 7L5.5 10L11.5 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const SVG_CHECK_CORRECT  = `<svg class="icon-check-correct" width="12" height="12" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2.5 7L5.5 10L11.5 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const SVG_WRONG          = `<svg class="icon-wrong" width="11" height="11" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3 3l8 8M11 3L3 11" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`;

/* ─── RESTORE SAVED PROGRESS ─── */
(function restoreProgress() {
  try {
    const saved = localStorage.getItem('ff_quiz_progress_screentime');
    if (saved) {
      const data = JSON.parse(saved);
      if (data && Array.isArray(data.answers) && data.answers.length === TOTAL) {
        answers = data.answers;
        currentIndex = Math.min(data.currentIndex || 0, TOTAL - 1);
        // Restore selected option for current question
        selectedOption = answers[currentIndex];
      }
    }
  } catch (e) {
    // Silently ignore corrupt data
  }
})();

/* ─── RENDER QUESTION ─── */
function renderQuestion(animDir) {
  const q = QUESTIONS[currentIndex];
  const savedAnswer = answers[currentIndex];
  selectedOption = savedAnswer;

  // Determine if this question has been answered previously (reviewed when moving back)
  // We show review state only on submit (last question), not on back navigation
  reviewed = false;

  // Build question HTML
  const questionNum = currentIndex + 1;
  const html = `
    <div class="question-slide${animDir === 'back' ? '-back' : ''}" id="q-block">
      <p class="question-number-label" aria-live="polite">Question ${questionNum} of ${TOTAL}</p>
      <h1 class="question-text" id="question-text">${escapeHtml(q.text)}</h1>

      <div
        class="answers-group"
        role="radiogroup"
        aria-labelledby="question-text"
        id="answers-group"
      >
        ${q.options.map((opt, i) => `
          <label
            class="answer-card${savedAnswer === i ? ' is-selected' : ''}"
            id="answer-card-${i}"
            role="radio"
            aria-checked="${savedAnswer === i ? 'true' : 'false'}"
            tabindex="${savedAnswer === i ? '0' : (i === 0 && savedAnswer === null ? '0' : '-1')}"
            data-index="${i}"
          >
            <input
              type="radio"
              name="q${currentIndex}"
              value="${i}"
              ${savedAnswer === i ? 'checked' : ''}
              tabindex="-1"
              aria-hidden="true"
            >
            <span class="answer-indicator" aria-hidden="true">
              ${savedAnswer === i ? SVG_CHECK_SELECTED : ''}
            </span>
            <span class="answer-letter" aria-hidden="true">${opt.letter}</span>
            <span class="answer-text">${escapeHtml(opt.text)}</span>
          </label>
        `).join('')}
      </div>
    </div>
  `;

  questionSection.innerHTML = html;

  // Attach events
  attachAnswerEvents();
  updateProgressBar();
  updateNavButtons();

  // Announce to screen readers
  // (aria-live on progress-count handles the count update)
}

/* ─── ATTACH ANSWER CARD EVENTS ─── */
function attachAnswerEvents() {
  const cards = questionSection.querySelectorAll('.answer-card');
  const group = questionSection.querySelector('[role="radiogroup"]');

  cards.forEach((card, i) => {
    // Click / tap
    card.addEventListener('click', () => selectOption(i));

    // Keyboard: Enter or Space to select
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        selectOption(i);
      }
      // Arrow key navigation within group
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        e.preventDefault();
        const next = cards[(i + 1) % cards.length];
        next.focus();
        selectOption((i + 1) % cards.length);
      }
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        e.preventDefault();
        const prev = cards[(i - 1 + cards.length) % cards.length];
        prev.focus();
        selectOption((i - 1 + cards.length) % cards.length);
      }
    });
  });
}

/* ─── SELECT OPTION ─── */
function selectOption(index) {
  if (reviewed) return; // locked after review

  const cards = questionSection.querySelectorAll('.answer-card');

  // Deselect all
  cards.forEach((card, i) => {
    card.classList.remove('is-selected');
    card.setAttribute('aria-checked', 'false');
    card.setAttribute('tabindex', '-1');
    card.querySelector('.answer-indicator').innerHTML = '';
    const input = card.querySelector('input[type="radio"]');
    if (input) input.checked = false;
  });

  // Select chosen
  const chosen = cards[index];
  if (!chosen) return;
  chosen.classList.add('is-selected');
  chosen.setAttribute('aria-checked', 'true');
  chosen.setAttribute('tabindex', '0');
  chosen.querySelector('.answer-indicator').innerHTML = SVG_CHECK_SELECTED;
  const chosenInput = chosen.querySelector('input[type="radio"]');
  if (chosenInput) chosenInput.checked = true;

  selectedOption = index;
  answers[currentIndex] = index;

  // Enable Next button
  btnNext.disabled = false;
  btnNext.removeAttribute('aria-disabled');

  saveProgress();
}

/* ─── SHOW REVIEW STATE (correct/wrong feedback) ─── */
function showReview() {
  reviewed = true;
  const correct = QUESTIONS[currentIndex].correct;
  const cards = questionSection.querySelectorAll('.answer-card');

  cards.forEach((card, i) => {
    card.removeEventListener('click', selectOption);
    card.setAttribute('tabindex', '-1');

    if (i === correct) {
      // Always mark correct answer as correct
      card.classList.remove('is-selected', 'is-neutral');
      card.classList.add('is-correct');
      card.setAttribute('aria-label', card.querySelector('.answer-text').textContent + ' (correct answer)');
      const ind = card.querySelector('.answer-indicator');
      ind.innerHTML = SVG_CHECK_CORRECT;
    } else if (i === selectedOption && selectedOption !== correct) {
      // User's wrong choice
      card.classList.remove('is-selected', 'is-neutral');
      card.classList.add('is-wrong');
      card.setAttribute('aria-label', card.querySelector('.answer-text').textContent + ' (incorrect)');
      const ind = card.querySelector('.answer-indicator');
      ind.innerHTML = SVG_WRONG;
    } else {
      // Other options
      card.classList.remove('is-selected');
      card.classList.add('is-neutral');
    }
  });
}

/* ─── UPDATE PROGRESS BAR ─── */
function updateProgressBar() {
  const questionNum = currentIndex + 1;
  const pct = Math.round((questionNum / TOTAL) * 100);
  progressFill.style.width = pct + '%';
  progressFill.setAttribute('aria-valuenow', pct);
  progressCount.textContent = questionNum + ' of ' + TOTAL;
}

/* ─── UPDATE NAV BUTTONS ─── */
function updateNavButtons() {
  // Back button: disabled on question 1
  btnBack.disabled = (currentIndex === 0);

  // Next button state
  const hasAnswer = answers[currentIndex] !== null;
  btnNext.disabled = !hasAnswer;
  if (!hasAnswer) {
    btnNext.setAttribute('aria-disabled', 'true');
  } else {
    btnNext.removeAttribute('aria-disabled');
  }

  // Last question: Next becomes "Submit"
  if (currentIndex === TOTAL - 1) {
    btnNext.innerHTML = 'Submit ✓';
    btnNext.setAttribute('aria-label', 'Submit quiz answers');
  } else {
    btnNext.innerHTML = 'Next →';
    btnNext.setAttribute('aria-label', 'Go to next question');
  }
}

/* ─── CALCULATE SCORE ─── */
function calculateScore() {
  let score = 0;
  answers.forEach((answer, i) => {
    if (answer === QUESTIONS[i].correct) score++;
  });
  return score;
}

/* ─── SAVE PROGRESS ─── */
function saveProgress() {
  try {
    localStorage.setItem('ff_quiz_progress_screentime', JSON.stringify({
      answers,
      currentIndex,
      savedAt: new Date().toISOString()
    }));
  } catch (e) {
    // localStorage unavailable — continue without saving
  }
}

/* ─── CLEAR PROGRESS ─── */
function clearProgress() {
  try {
    localStorage.removeItem('ff_quiz_progress_screentime');
  } catch (e) {}
}

/* ─── SUBMIT QUIZ ─── */
function submitQuiz() {
  const score = calculateScore();
  const passed = score >= 8;
  const result = {
    score,
    total: TOTAL,
    passed,
    date: new Date().toISOString()
  };

  try {
    localStorage.setItem('ff_quiz_score_screentime', JSON.stringify(result));
    // Update progress tracker
    try {
      const prog = JSON.parse(localStorage.getItem('ff_progress') || '{}');
      if (!prog['screen-time']) prog['screen-time'] = { ebook: 10, quiz: 0, cert: false };
      prog['screen-time'].quiz = passed ? 100 : Math.round((score / 10) * 100);
      localStorage.setItem('ff_progress', JSON.stringify(prog));
    } catch (e) { /* localStorage unavailable */ }
  } catch (e) {}

  clearProgress();

  if (passed) {
    window.location.href = 'certificates/certificate-screentime.html';
  } else {
    window.location.href = 'quiz-fail-screentime.html';
  }
}

/* ─── NEXT BUTTON HANDLER ─── */
btnNext.addEventListener('click', () => {
  if (answers[currentIndex] === null) return; // no answer selected

  if (currentIndex === TOTAL - 1) {
    // Last question: submit
    submitQuiz();
    return;
  }

  direction = 'forward';
  currentIndex++;
  saveProgress();
  renderQuestion('forward');

  // Scroll to top of question on mobile
  questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

/* ─── BACK BUTTON HANDLER ─── */
btnBack.addEventListener('click', () => {
  if (currentIndex === 0) return;
  direction = 'back';
  currentIndex--;
  saveProgress();
  renderQuestion('back');
  questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

/* ─── SAVE & EXIT HANDLER ─── */
btnSaveExit.addEventListener('click', () => {
  saveProgress();
  window.location.href = 'dashboard.html';
});

/* ─── ESCAPE KEY: Save & Exit ─── */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    saveProgress();
    window.location.href = 'dashboard.html';
  }
});

/* ─── HTML ESCAPE UTILITY ─── */
function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ─── INIT ─── */
renderQuestion('forward');
</script>
