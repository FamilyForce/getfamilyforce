<script>
document.addEventListener('DOMContentLoaded', function () {
  ScoutDash.init('history', function (user, child, sub) {
    loadHistory(child)
  })
})

var _allMonths = []

function loadHistory(child) {
  var sb = ScoutDash.getSb()
  // Load all window_progress for this child + the window details
  Promise.all([
    sb.from('window_progress').select('*').eq('child_id', child.id).order('updated_at', { ascending: false }),
    sb.from('milestone_windows').select('id, title, category, urgency, open_age_weeks, close_age_weeks'),
    sb.from('scout_digest_log').select('sent_at, age_months').eq('user_id', user_id()).eq('child_id', child.id).order('sent_at', { ascending: false }),
  ]).then(function (results) {
    var progress = results[0].data || []
    var windows  = results[1].data || []
    var digests  = results[2].data || []

    var winMap = {}
    windows.forEach(function (w) { winMap[w.id] = w })

    // Deduplicate progress rows by window_id across family members — best status wins
    var STATUS_RANK = { completed: 3, skipped: 3, in_progress: 2, open: 1 }
    var dedupedMap = {}
    progress.forEach(function (p) {
      var existing = dedupedMap[p.window_id]
      if (!existing || (STATUS_RANK[p.status] || 0) > (STATUS_RANK[existing.status] || 0)) {
        dedupedMap[p.window_id] = p
      }
    })
    progress = Object.values(dedupedMap)

    // Build digest buckets (chronological order)
    var monthMap = {}
    var sortedDigests = digests.slice().sort(function (a, b) { return new Date(a.sent_at) - new Date(b.sent_at) })
    sortedDigests.forEach(function (d) {
      var key = d.age_months
      if (!monthMap[key]) {
        var date  = new Date(d.sent_at)
        var label = date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })
        monthMap[key] = { label: label, ageMonths: key, sentAt: d.sent_at, windows: [] }
      }
    })

    // Assign each progress row to the digest period during which it was completed.
    // Rule: find the most recent digest sent on or before updated_at.
    // If completed before the first digest, use the first digest bucket.
    // If no digests at all, fall through to the fallback below.
    var childDob  = child.dob ? new Date(child.dob) : null
    var unmatched = []
    progress.forEach(function (p) {
      var w = winMap[p.window_id]
      if (!w) return

      if (sortedDigests.length === 0) { unmatched.push({ progress: p, window: w }); return }

      var completedAt  = p.updated_at ? new Date(p.updated_at) : null
      var targetBucket = null

      if (completedAt) {
        // Walk chronologically — keep the last digest whose sent_at <= completedAt
        for (var i = 0; i < sortedDigests.length; i++) {
          if (new Date(sortedDigests[i].sent_at) <= completedAt) targetBucket = monthMap[sortedDigests[i].age_months]
        }
        // Completed before the first digest — assign to earliest bucket
        if (!targetBucket) targetBucket = monthMap[sortedDigests[0].age_months]
      } else {
        // No timestamp — assign to most recent digest
        targetBucket = monthMap[sortedDigests[sortedDigests.length - 1].age_months]
      }

      if (targetBucket) {
        targetBucket.windows.push({ progress: p, window: w })
      } else {
        unmatched.push({ progress: p, window: w })
      }
    })

    // Fallback: no digests at all — bucket by child's actual age at completion.
    // Uses calendar month arithmetic (exact, no week rounding) and the same
    // "Month Year" label format as digest buckets for visual consistency.
    if (unmatched.length > 0) {
      unmatched.forEach(function (e) {
        var w    = e.window
        var ageM = null
        var labelStr = null
        if (childDob && e.progress.updated_at) {
          var completedAt = new Date(e.progress.updated_at)
          var calMonths   = (completedAt.getFullYear() - childDob.getFullYear()) * 12
                          + (completedAt.getMonth() - childDob.getMonth())
          if (completedAt.getDate() < childDob.getDate()) calMonths--
          var openM  = ScoutDash.weeksToMonths(w.open_age_weeks)
          var closeM = ScoutDash.weeksToMonths(w.close_age_weeks)
          ageM     = Math.max(openM, Math.min(closeM, calMonths))
          labelStr = completedAt.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })
        }
        // Last resort: window midpoint
        if (ageM === null) ageM = ScoutDash.weeksToMonths((w.open_age_weeks + w.close_age_weeks) / 2)
        if (!labelStr) labelStr = ageM + ' month' + (ageM === 1 ? '' : 's')
        var key = 'fallback-' + ageM
        if (!monthMap[key]) {
          monthMap[key] = { label: labelStr, ageMonths: ageM, sentAt: null, windows: [], isFallback: true }
        }
        monthMap[key].windows.push(e)
      })
    }

    // Remove in_progress from all month buckets before rendering
    Object.values(monthMap).forEach(function (m) {
      m.windows = m.windows.filter(function (e) {
        return e.progress.status === 'completed' || e.progress.status === 'skipped'
      })
    })

    _allMonths = Object.values(monthMap)
      .filter(function (m) { return m.windows.length > 0 })
      .sort(function (a, b) { return b.ageMonths - a.ageMonths })
    renderHistory(_allMonths, child)
  })
}

function user_id() {
  return ScoutDash.getUser() ? ScoutDash.getUser().id : ''
}

function renderHistory(months, child) {
  var list = document.getElementById('historyList')
  if (months.length === 0) {
    list.innerHTML = '<div class="end-state"><p class="end-state-title">No history yet.</p><p class="end-state-text">Your digest and progress history will appear here after your first monthly update.</p></div>'
    return
  }

  // Merge all pre-birth buckets (ageMonths <= 0) — but split by window definition:
  //   • window.open_age_weeks < 0  → genuinely pre-birth → "Pre-birth" group
  //   • window.open_age_weeks >= 0 → post-birth window checked early → "Newborn" group
  // This handles the case where newborn tasks (e.g. tummy time, bilirubin check) were
  // marked complete before the birth was confirmed in the app.
  var prebirth  = months.filter(function (m) { return m.ageMonths <= 0 })
  var postnatal = months.filter(function (m) { return m.ageMonths > 0 })
  if (prebirth.length > 0) {
    var mergedPrebirth = []
    var mergedNewborn  = []
    prebirth.forEach(function (m) {
      m.windows.forEach(function (e) {
        var openWeeks = e.window.open_age_weeks != null ? e.window.open_age_weeks : 0
        if (openWeeks < 0) {
          mergedPrebirth.push(e)
        } else {
          mergedNewborn.push(e)
        }
      })
    })
    if (mergedPrebirth.length > 0) {
      postnatal = postnatal.concat([{ label: 'Pre-birth', ageMonths: -1, windows: mergedPrebirth, isPrebirth: true }])
    }
    if (mergedNewborn.length > 0) {
      postnatal = postnatal.concat([{ label: 'Newborn', ageMonths: 0, windows: mergedNewborn, isNewborn: true }])
    }
  }
  months = postnatal

  var html = ''
  months.forEach(function (m, i) {
    var doneCount = m.windows.length  // already filtered to completed/skipped before renderHistory
    var headingLabel = m.isPrebirth ? 'Pre-birth' : m.isNewborn ? 'Newborn' : m.label
    var subLabel     = m.isPrebirth
      ? (child.name + ' — before birth')
      : m.isNewborn
        ? (child.name + ' — first month')
        : (child.name + ' at ' + m.ageMonths + ' month' + (m.ageMonths === 1 ? '' : 's'))
    html += '<div class="history-month" id="histMonth-' + i + '">' +
      '<div class="history-month-header" onclick="toggleMonth(' + i + ')">' +
      '<div class="history-month-left">' +
      '<h3>' + headingLabel + '</h3>' +
      '<p>' + subLabel + '</p>' +
      '</div>' +
      '<div class="history-month-right">' +
      '<span class="history-month-stat">' + doneCount + ' completed</span>' +
      '<span class="history-month-arrow">▾</span>' +
      '</div>' +
      '</div>' +
      '<div class="history-month-body">'
    if (m.windows.length === 0) {
      html += '<p style="padding:16px 20px;font-size:14px;color:var(--text-dim)">No windows recorded for this month.</p>'
    } else {
      m.windows.forEach(function (e) {
        var statusIcon = { completed: '✅', skipped: '–', in_progress: '▶', open: '○' }
        var note = e.progress.notes || ''
        var notePreview = note.length > 60 ? note.slice(0, 60) + '…' : note
        html += '<div class="history-window-row">' +
          '<div class="history-window-status">' + (statusIcon[e.progress.status] || '○') + '</div>' +
          '<div class="history-window-info">' +
          '<p class="history-window-title">' + ScoutDash._esc(e.window.title) + '</p>' +
          '<span class="badge badge-category" style="font-size:10px;padding:2px 7px">' + ScoutDash._esc(e.window.category || '') + '</span>' +
          (note ? '<p class="history-window-note">' + ScoutDash._esc(notePreview) + (note.length > 60 ? ' <span class="history-window-note-more" onclick="expandNote(this,\'' + ScoutDash._esc(note).replace(/'/g, '\\\'') + '\')">Read more</span>' : '') + '</p>' : '') +
          '</div>' +
          '</div>'
      })
    }
    html += '</div></div>'
  })
  list.innerHTML = html

  // Auto-open first month
  toggleMonth(0)
}

function toggleMonth(i) {
  var el = document.getElementById('histMonth-' + i)
  if (el) el.classList.toggle('open')
}

function expandNote(el, full) {
  // el is the "Read more" span inside the note paragraph — replace only the paragraph text
  var p = el.closest ? el.closest('.history-window-note') : el.parentNode
  if (p) p.textContent = full
}

// Search
document.addEventListener('DOMContentLoaded', function () {
  var search     = document.getElementById('historySearch')
  var clearBtn   = document.getElementById('historySearchClear')
  if (search && clearBtn) {
    search.addEventListener('input', function () {
      clearBtn.style.display = search.value ? 'flex' : 'none'
    })
    clearBtn.addEventListener('click', function () {
      search.value = ''
      clearBtn.style.display = 'none'
      renderHistory(_allMonths, ScoutDash.getChild())
      search.focus()
    })
  }
  if (search) {
    search.addEventListener('input', function () {
      var q = search.value.toLowerCase().trim()
      if (!q) { renderHistory(_allMonths, ScoutDash.getChild()); return }
      // Guard: data hasn't loaded yet
      if (!_allMonths.length) {
        document.getElementById('historyList').innerHTML = '<div class="loading-state">Loading history…</div>'
        return
      }
      var filtered = _allMonths.map(function (m) {
        return Object.assign({}, m, {
          windows: m.windows.filter(function (e) {
            return (e.window.title || '').toLowerCase().includes(q) ||
                   (e.progress.notes || '').toLowerCase().includes(q)
          })
        })
      }).filter(function (m) { return m.windows.length > 0 })
      renderHistory(filtered, ScoutDash.getChild())
    })
  }
})
</script>
