<script>
document.addEventListener('DOMContentLoaded', function () {
  ScoutDash.init('history', function (user, child, sub) {
    loadHistory(child)
  })
})

var _allMonths = []

function loadHistory(child) {
  var sb = ScoutDash.getSb()
  // Load all window_progress for this child + the window details
  Promise.all([
    sb.from('window_progress').select('*').eq('child_id', child.id).order('updated_at', { ascending: false }),
    sb.from('milestone_windows').select('id, title, category, urgency, open_age_weeks, close_age_weeks'),
    sb.from('scout_digest_log').select('sent_at, age_months').eq('user_id', user_id()).order('sent_at', { ascending: false }),
  ]).then(function (results) {
    var progress = results[0].data || []
    var windows  = results[1].data || []
    var digests  = results[2].data || []

    var winMap = {}
    windows.forEach(function (w) { winMap[w.id] = w })

    // Deduplicate progress rows by window_id across family members — best status wins
    var STATUS_RANK = { completed: 3, skipped: 3, in_progress: 2, open: 1 }
    var dedupedMap = {}
    progress.forEach(function (p) {
      var existing = dedupedMap[p.window_id]
      if (!existing || (STATUS_RANK[p.status] || 0) > (STATUS_RANK[existing.status] || 0)) {
        dedupedMap[p.window_id] = p
      }
    })
    progress = Object.values(dedupedMap)

    // Group progress by month.
    // Primary: use digest log entries as month buckets.
    // Fallback: if no digests yet, group by the window's age range against child's current age.
    var monthMap = {}
    digests.forEach(function (d) {
      var key = d.age_months
      if (!monthMap[key]) {
        var date  = new Date(d.sent_at)
        var label = date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })
        monthMap[key] = { label: label, ageMonths: key, sentAt: d.sent_at, windows: [] }
      }
    })

    // Attach progress to digest-based month buckets where possible
    var unmatched = []
    progress.forEach(function (p) {
      var w = winMap[p.window_id]
      if (!w) return
      var targetMonth = null
      Object.values(monthMap).forEach(function (m) {
        var openM  = ScoutDash.weeksToMonths(w.open_age_weeks)
        var closeM = ScoutDash.weeksToMonths(w.close_age_weeks)
        if (m.ageMonths >= openM && m.ageMonths <= closeM) {
          if (!targetMonth || m.ageMonths > targetMonth.ageMonths) targetMonth = m
        }
      })
      if (targetMonth) {
        targetMonth.windows.push({ progress: p, window: w })
      } else {
        unmatched.push({ progress: p, window: w })
      }
    })

    // Fallback: bucket unmatched progress by window's peak age month
    // (handles users who have marked windows before receiving their first digest)
    if (unmatched.length > 0) {
      unmatched.forEach(function (e) {
        var w       = e.window
        var peakM   = ScoutDash.weeksToMonths((w.open_age_weeks + w.close_age_weeks) / 2)
        var key     = 'progress-' + peakM
        if (!monthMap[key]) {
          monthMap[key] = {
            label:      peakM + ' month' + (peakM === 1 ? '' : 's'),
            ageMonths:  peakM,
            sentAt:     null,
            windows:    [],
            isFallback: true,
          }
        }
        monthMap[key].windows.push(e)
      })
    }

    _allMonths = Object.values(monthMap)
      .filter(function (m) { return m.windows.length > 0 || !m.isFallback })
      .sort(function (a, b) { return b.ageMonths - a.ageMonths })
    renderHistory(_allMonths, child)
  })
}

function user_id() {
  return ScoutDash.getUser() ? ScoutDash.getUser().id : ''
}

function renderHistory(months, child) {
  var list = document.getElementById('historyList')
  if (months.length === 0) {
    list.innerHTML = '<div class="end-state"><p class="end-state-title">No history yet.</p><p class="end-state-text">Your digest and progress history will appear here after your first monthly update.</p></div>'
    return
  }
  var html = ''
  months.forEach(function (m, i) {
    var doneCount = m.windows.filter(function (e) { return e.progress.status === 'completed' }).length
    html += '<div class="history-month" id="histMonth-' + i + '">' +
      '<div class="history-month-header" onclick="toggleMonth(' + i + ')">' +
      '<div class="history-month-left">' +
      '<h3>' + m.label + '</h3>' +
      '<p>' + child.name + ' at ' + m.ageMonths + ' month' + (m.ageMonths === 1 ? '' : 's') + '</p>' +
      '</div>' +
      '<div class="history-month-right">' +
      '<span class="history-month-stat">' + m.windows.length + ' windows</span>' +
      '<span class="history-month-stat">' + doneCount + ' done</span>' +
      '<span class="history-month-arrow">▾</span>' +
      '</div>' +
      '</div>' +
      '<div class="history-month-body">'
    if (m.windows.length === 0) {
      html += '<p style="padding:16px 20px;font-size:14px;color:var(--text-dim)">No windows recorded for this month.</p>'
    } else {
      m.windows.forEach(function (e) {
        var statusIcon = { completed: '✅', skipped: '–', in_progress: '▶', open: '○' }
        var note = e.progress.notes || ''
        var notePreview = note.length > 60 ? note.slice(0, 60) + '…' : note
        html += '<div class="history-window-row">' +
          '<div class="history-window-status">' + (statusIcon[e.progress.status] || '○') + '</div>' +
          '<div class="history-window-info">' +
          '<p class="history-window-title">' + ScoutDash._esc(e.window.title) + '</p>' +
          '<span class="badge badge-category" style="font-size:10px;padding:2px 7px">' + ScoutDash._esc(e.window.category || '') + '</span>' +
          (note ? '<p class="history-window-note">' + ScoutDash._esc(notePreview) + (note.length > 60 ? ' <span class="history-window-note-more" onclick="expandNote(this,\'' + ScoutDash._esc(note).replace(/'/g, '\\\'') + '\')">Read more</span>' : '') + '</p>' : '') +
          '</div>' +
          '</div>'
      })
    }
    html += '</div></div>'
  })
  list.innerHTML = html

  // Auto-open first month
  toggleMonth(0)
}

function toggleMonth(i) {
  var el = document.getElementById('histMonth-' + i)
  if (el) el.classList.toggle('open')
}

function expandNote(el, full) {
  // el is the "Read more" span inside the note paragraph — replace only the paragraph text
  var p = el.closest ? el.closest('.history-window-note') : el.parentNode
  if (p) p.textContent = full
}

// Search
document.addEventListener('DOMContentLoaded', function () {
  var search     = document.getElementById('historySearch')
  var clearBtn   = document.getElementById('historySearchClear')
  if (search && clearBtn) {
    search.addEventListener('input', function () {
      clearBtn.style.display = search.value ? 'flex' : 'none'
    })
    clearBtn.addEventListener('click', function () {
      search.value = ''
      clearBtn.style.display = 'none'
      renderHistory(_allMonths, ScoutDash.getChild())
      search.focus()
    })
  }
  if (search) {
    search.addEventListener('input', function () {
      var q = search.value.toLowerCase().trim()
      if (!q) { renderHistory(_allMonths, ScoutDash.getChild()); return }
      // Guard: data hasn't loaded yet
      if (!_allMonths.length) {
        document.getElementById('historyList').innerHTML = '<div class="loading-state">Loading history…</div>'
        return
      }
      var filtered = _allMonths.map(function (m) {
        return Object.assign({}, m, {
          windows: m.windows.filter(function (e) {
            return (e.window.title || '').toLowerCase().includes(q) ||
                   (e.progress.notes || '').toLowerCase().includes(q)
          })
        })
      }).filter(function (m) { return m.windows.length > 0 })
      renderHistory(filtered, ScoutDash.getChild())
    })
  }
})
</script>
