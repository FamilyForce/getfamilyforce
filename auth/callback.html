<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing you in… — FamilyForce</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #fafafa;
      color: #333;
    }
    .wrap {
      text-align: center;
      padding: 40px 20px;
    }
    .logo {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 32px;
      display: block;
    }
    .logo span { color: #6E4ED6; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #E8E0FF;
      border-top-color: #6E4ED6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #666; font-size: 15px; }
    .error { color: #c0392b; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="logo" href="/">Family<span>Force</span></a>
    <div class="spinner" id="spinner"></div>
    <p id="msg">Signing you in…</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/ff-sync.js"></script>
  <script>
    const SUPABASE_URL  = 'https://ewjqbafaxeasyvknxmof.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3anFiYWZheGVhc3l2a254bW9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNDUyMDMsImV4cCI6MjA4ODYyMTIwM30.5_NCJP7r5BZSFXcA_WMBiK13vs5Q2bLVdcOZkzyvsWQ';

    window._supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    const sb = window._supabaseClient;

    async function handleCallback() {
      try {
        const { data, error } = await sb.auth.getSession();

        if (error) throw error;

        if (data.session) {
          // Pull profile + progress from Supabase → merge into localStorage
          // (ff-sync.js also writes ff_user_id and ff_user_email)
          await window.ffSync.onSignIn(data.session);

          // New users (no ff_onboarded flag) go through onboarding first
          const onboarded = localStorage.getItem('ff_onboarded');
          if (!onboarded) {
            // Pass along any ?next so onboarding can redirect correctly after
            window.location.href = '../onboarding.html';
          } else {
            // Returning user — straight to dashboard (or ?next param)
            const next = sessionStorage.getItem('ff_signin_next') || '../dashboard.html';
            sessionStorage.removeItem('ff_signin_next');
            window.location.href = next;
          }
        } else {
          throw new Error('No session found');
        }
      } catch (err) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('msg').innerHTML =
          '<span class="error">Sign-in failed. <a href="../sign-in.html">Try again →</a></span>';
      }
    }

    handleCallback();
  </script>
</body>
</html>
