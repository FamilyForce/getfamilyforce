<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing you in… — FamilyForce</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:#fafafa; color:#333; }
    .wrap { text-align:center; padding:40px 20px; max-width:400px; width:100%; }
    .logo { font-size:20px; font-weight:800; margin-bottom:32px; display:block; text-decoration:none; color:#333; }
    .logo span { color:#6E4ED6; }
    .spinner { width:40px; height:40px; border:3px solid #E8E0FF; border-top-color:#6E4ED6; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 24px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    p { color:#666; font-size:15px; line-height:1.6; }
    .error { color:#c0392b; }
    /* Password update form */
    .reset-card { background:#fff; border:1.5px solid #E8E0FF; border-radius:16px; padding:32px; text-align:left; }
    .reset-title { font-size:22px; font-weight:800; color:#1A1523; margin:0 0 8px; }
    .reset-sub { font-size:14px; color:#6B6883; margin:0 0 24px; }
    .field { margin-bottom:18px; }
    label { display:block; font-size:13px; font-weight:600; color:#1A1523; margin-bottom:6px; }
    input[type=password] { width:100%; box-sizing:border-box; padding:12px 14px; border:1.5px solid #E0DCF0; border-radius:10px; font-family:inherit; font-size:14px; color:#1A1523; background:#fff; outline:none; transition:border-color .15s; }
    input[type=password]:focus { border-color:#6E4ED6; box-shadow:0 0 0 3px rgba(110,78,214,.1); }
    .btn { width:100%; padding:14px; background:#6E4ED6; color:#fff; border:none; border-radius:100px; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; margin-top:4px; transition:background .15s; }
    .btn:hover { background:#5B3CC4; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .err-msg { font-size:12px; color:#DC2626; margin-top:6px; display:none; }
    .success-msg { font-size:14px; color:#16A34A; margin-top:12px; display:none; text-align:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="logo" href="/">Family<span>Force</span></a>

    <!-- Default: spinner while processing -->
    <div id="spinnerView">
      <div class="spinner"></div>
      <p id="msg">Signing you in…</p>
    </div>

    <!-- Password reset form (shown for type=recovery) -->
    <div id="resetView" style="display:none">
      <div class="reset-card">
        <h1 class="reset-title">Set a new password</h1>
        <p class="reset-sub">Enter a new password for your FamilyForce account.</p>
        <div class="field">
          <label for="newPw">New password</label>
          <input type="password" id="newPw" placeholder="At least 8 characters" autocomplete="new-password">
          <p class="err-msg" id="pwErr"></p>
        </div>
        <div class="field">
          <label for="confirmPw">Confirm password</label>
          <input type="password" id="confirmPw" placeholder="Repeat your new password" autocomplete="new-password">
          <p class="err-msg" id="confirmErr"></p>
        </div>
        <button class="btn" id="resetBtn" onclick="submitReset()">Update password →</button>
        <p class="success-msg" id="resetSuccess">Password updated! Taking you to the dashboard…</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL  = 'https://ewjqbafaxeasyvknxmof.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3anFiYWZheGVhc3l2a254bW9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNDUyMDMsImV4cCI6MjA4ODYyMTIwM30.5_NCJP7r5BZSFXcA_WMBiK13vs5Q2bLVdcOZkzyvsWQ';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    async function handleCallback() {
      try {
        // Parse hash for type — check for error fragments first
        const hash   = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);

        const errorCode = params.get('error_code') || params.get('error');
        if (errorCode) {
          const desc = (params.get('error_description') || errorCode).replace(/\+/g, ' ');
          const isExpired = errorCode === 'otp_expired' || desc.toLowerCase().includes('expired');
          document.getElementById('spinner') && (document.getElementById('spinner').style.display = 'none');
          document.getElementById('msg').innerHTML = isExpired
            ? 'That link has expired. <a href="../scout-dashboard/settings.html" style="color:var(--terra);font-weight:700">Go back to settings</a> and request a new one.'
            : 'Something went wrong: ' + desc + '. <a href="../sign-in.html" style="color:var(--terra);font-weight:700">Try again →</a>';
          return;
        }

        // Supabase info message (e.g. "Confirmation link accepted. Please proceed to confirm link sent to the other email")
        const message = params.get('message');
        if (message) {
          document.getElementById('spinner') && (document.getElementById('spinner').style.display = 'none');
          const friendly = message.replace(/\+/g, ' ');
          const isEmailChange = friendly.toLowerCase().includes('confirm') || friendly.toLowerCase().includes('email');
          document.getElementById('msg').innerHTML = isEmailChange
            ? '✓ ' + friendly + '<br><br><a href="../scout-dashboard/settings.html" style="color:var(--terra);font-weight:700">Back to settings →</a>'
            : friendly;
          return;
        }

        const type   = params.get('type') || new URLSearchParams(window.location.search).get('type') || '';

        // Let Supabase process the hash and establish session
        const { data, error } = await sb.auth.getSession();
        if (error) throw error;

        if (type === 'recovery') {
          // Password reset flow — show the update form, don't redirect yet
          document.getElementById('spinnerView').style.display = 'none';
          document.getElementById('resetView').style.display   = 'block';
          return;
        }

        if (data.session) {
          // Normal sign-in / signup confirmation
          const user       = data.session.user;
          const next       = sessionStorage.getItem('ff_signin_next') || null;
          const intent     = sessionStorage.getItem('ff_intent') || null;

          // — Family invite acceptance —
          const inviteChild = localStorage.getItem('ff_invite_child');
          const inviteEmail = localStorage.getItem('ff_invite_email');
          if (inviteChild && inviteEmail) {
            localStorage.removeItem('ff_invite_child');
            localStorage.removeItem('ff_invite_email');
            // Link this user to the invited child via the edge function
            try {
              const FUNCTIONS_URL = 'https://ewjqbafaxeasyvknxmof.supabase.co/functions/v1';
              const acceptRes = await fetch(FUNCTIONS_URL + '/scout-family-accept', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + data.session.access_token,
                },
                body: JSON.stringify({ childId: inviteChild, inviteEmail: inviteEmail }),
              });
              // Only set active child if accept succeeded
              if (acceptRes.ok) localStorage.setItem('scout_active_child_id', inviteChild);
            } catch (e) { console.warn('[invite] accept failed:', e); }
            // Skip child setup — go straight to dashboard
            window.location.href = '../scout-dashboard.html';
            return;
          }

          // Check if user has completed onboarding (has children)
          const { data: children } = await sb.from('children').select('id').eq('user_id', user.id).limit(1);
          const hasChildren = children && children.length > 0;

          if (!hasChildren) {
            // New user — go to sign-in to complete child setup
            window.location.href = '../sign-in.html' + (intent ? '?intent=' + intent : '');
          } else if (intent === 'subscribe') {
            window.location.href = '../sign-in.html?intent=subscribe';
          } else {
            window.location.href = next || '../scout-dashboard.html';
          }
        } else {
          throw new Error('No session found');
        }
      } catch (err) {
        document.getElementById('spinner') && (document.getElementById('spinner').style.display = 'none');
        document.getElementById('msg').innerHTML =
          '<span class="error">Sign-in failed. <a href="../sign-in.html">Try again →</a></span>';
      }
    }

    window.submitReset = async function() {
      const pw      = document.getElementById('newPw').value;
      const confirm = document.getElementById('confirmPw').value;
      const btn     = document.getElementById('resetBtn');
      const pwErr   = document.getElementById('pwErr');
      const confErr = document.getElementById('confirmErr');

      pwErr.style.display = 'none';
      confErr.style.display = 'none';

      if (!pw || pw.length < 8) {
        pwErr.textContent = 'Password must be at least 8 characters.';
        pwErr.style.display = 'block';
        return;
      }
      if (pw !== confirm) {
        confErr.textContent = 'Passwords don\'t match.';
        confErr.style.display = 'block';
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Updating…';

      const { error } = await sb.auth.updateUser({ password: pw });
      if (error) {
        btn.disabled    = false;
        btn.textContent = 'Update password →';
        pwErr.textContent = error.message || 'Could not update password. Please try again.';
        pwErr.style.display = 'block';
        return;
      }

      document.getElementById('resetSuccess').style.display = 'block';
      btn.style.display = 'none';
      setTimeout(function() { window.location.href = '../scout-dashboard.html'; }, 1800);
    };

    handleCallback();
  </script>
</body>
</html>
