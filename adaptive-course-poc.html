<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen Time Playbook — Adaptive Course (PoC)</title>
<style>
  :root {
    --purple: #6E4ED6;
    --purple-dark: #5B3CC4;
    --purple-light: #EDE9FB;
    --purple-mid: #9B82E8;
    --bg: #F5F3FF;
    --card: #FFFFFF;
    --text: #1A1030;
    --text-soft: #5A4E7A;
    --correct: #22c55e;
    --correct-bg: #F0FDF4;
    --wrong: #ef4444;
    --wrong-bg: #FEF2F2;
    --shadow: 0 2px 12px rgba(110,78,214,0.10);
    --radius: 14px;
    --font: 'Outfit', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px 80px;
  }
  .app { width: 100%; max-width: 600px; }

  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .brand { font-size: 13px; font-weight: 700; color: var(--purple); letter-spacing: 0.04em; text-transform: uppercase; }
  .xp-pill { background: var(--purple); color: white; font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 999px; }

  .card { background: var(--card); border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow); margin-bottom: 16px; }

  .progress-wrap { margin-bottom: 20px; }
  .progress-label { font-size: 12px; color: var(--text-soft); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .progress-bar { height: 8px; background: var(--purple-light); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--purple); border-radius: 99px; transition: width 0.4s ease; }

  h1 { font-size: 26px; font-weight: 800; line-height: 1.2; margin-bottom: 10px; }
  h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  h3 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  p { font-size: 15px; line-height: 1.65; color: var(--text-soft); }
  p + p { margin-top: 10px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--purple); margin-bottom: 8px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: none; border-radius: 10px; font-family: var(--font); font-weight: 700;
    font-size: 15px; cursor: pointer; padding: 14px 24px; transition: all 0.15s;
    width: 100%; margin-top: 12px;
  }
  .btn-primary { background: var(--purple); color: white; }
  .btn-primary:hover { background: var(--purple-dark); transform: translateY(-1px); }
  .btn-secondary { background: var(--purple-light); color: var(--purple-dark); }
  .btn-secondary:hover { background: #DDD5FA; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .options { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
  .option {
    border: 2px solid #E8E2F8; border-radius: 10px; padding: 14px 16px;
    cursor: pointer; font-size: 14px; line-height: 1.5; color: var(--text);
    background: white; text-align: left; transition: all 0.15s; font-family: var(--font); width: 100%;
  }
  .option:hover:not(:disabled) { border-color: var(--purple-mid); background: var(--purple-light); }
  .option.selected { border-color: var(--purple); background: var(--purple-light); color: var(--purple-dark); font-weight: 600; }
  .option.correct { border-color: var(--correct); background: var(--correct-bg); color: #15803d; font-weight: 600; }
  .option.wrong { border-color: var(--wrong); background: var(--wrong-bg); color: #b91c1c; }
  .option:disabled { cursor: default; }

  .feedback-box { border-radius: 10px; padding: 16px; margin-top: 16px; font-size: 14px; line-height: 1.6; }
  .feedback-correct { background: var(--correct-bg); border: 1px solid #86efac; color: #166534; }
  .feedback-wrong { background: var(--wrong-bg); border: 1px solid #fca5a5; color: #991b1b; }
  .feedback-icon { font-size: 18px; margin-bottom: 6px; display: block; }
  .feedback-title { font-weight: 700; margin-bottom: 4px; }

  /* Jack's story block */
  .story-block {
    background: #FDFCFF;
    border-left: 4px solid var(--purple-mid);
    border-radius: 0 10px 10px 0;
    padding: 18px 20px;
    margin: 16px 0;
    font-style: italic;
    position: relative;
  }
  .story-block p { color: var(--text); font-size: 15px; line-height: 1.7; }
  .story-block p + p { margin-top: 12px; }
  .story-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--purple-mid); margin-bottom: 10px;
    font-style: normal;
  }

  /* Concept block */
  .lesson-concept {
    background: var(--purple-light);
    border-radius: 10px;
    padding: 16px 18px;
    margin: 16px 0;
  }
  .lesson-concept p { color: var(--text); font-size: 15px; font-style: normal; }
  .concept-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--purple); margin-bottom: 8px;
  }

  /* Key takeaway */
  .key-takeaway {
    background: var(--purple);
    color: white;
    border-radius: 10px;
    padding: 14px 18px;
    margin: 14px 0;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.5;
  }
  .key-takeaway-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; opacity: 0.75; margin-bottom: 4px;
  }

  /* Unit map cards */
  .unit-grid { display: flex; flex-direction: column; gap: 10px; }
  .unit-card {
    display: flex; align-items: flex-start; gap: 14px;
    background: white; border: 2px solid #E8E2F8; border-radius: 12px;
    padding: 14px 16px; cursor: pointer; transition: all 0.15s;
    text-align: left; font-family: var(--font); width: 100%;
  }
  .unit-card:hover:not(:disabled) { border-color: var(--purple); transform: translateY(-1px); box-shadow: var(--shadow); }
  .unit-card.completed { border-color: var(--correct); background: var(--correct-bg); }
  .unit-card.gap { border-color: var(--purple); }
  .unit-card.locked { opacity: 0.5; cursor: not-allowed; }
  .unit-card:disabled { cursor: not-allowed; transform: none; }
  .unit-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--purple-light); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .unit-card.gap .unit-icon { background: var(--purple); }
  .unit-card.completed .unit-icon { background: var(--correct-bg); }
  .unit-meta { flex: 1; }
  .unit-title { font-weight: 700; font-size: 14px; color: var(--text); margin-bottom: 3px; }
  .unit-sub { font-size: 12px; color: var(--text-soft); }
  .unit-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 99px; white-space: nowrap; flex-shrink: 0; }
  .badge-gap { background: var(--purple); color: white; }
  .badge-review { background: var(--purple-light); color: var(--purple-dark); border: 1px solid var(--purple-mid); }
  .badge-done { background: var(--correct-bg); color: #166534; border: 1px solid #86efac; }
  .badge-locked { background: #f1f0f5; color: #aaa; }

  /* XP */
  .xp-burst { text-align: center; padding: 20px 0 10px; }
  .xp-big { font-size: 48px; font-weight: 800; color: var(--purple); display: block; }
  .xp-label { font-size: 14px; color: var(--text-soft); margin-top: 4px; }

  /* Welcome */
  .hero-icon { font-size: 48px; text-align: center; margin-bottom: 16px; }
  .stats-row { display: flex; gap: 12px; margin: 20px 0; }
  .stat-box { flex: 1; background: var(--purple-light); border-radius: 10px; padding: 14px 10px; text-align: center; }
  .stat-num { font-size: 22px; font-weight: 800; color: var(--purple); }
  .stat-label { font-size: 11px; color: var(--text-soft); margin-top: 2px; }

  .chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--purple-light); color: var(--purple-dark); margin: 2px; }
  .divider { height: 1px; background: #EDE9FB; margin: 16px 0; }
  .dot-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 20px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--purple-light); }
  .dot.active { background: var(--purple); }
  .dot.done { background: var(--purple-mid); }

  /* Step tracker */
  .step-track { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
  .step { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text-soft); }
  .step.active { color: var(--purple); }
  .step.done { color: var(--correct); }
  .step-circle { width: 24px; height: 24px; border-radius: 50%; background: var(--purple-light); color: var(--purple); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .step.active .step-circle { background: var(--purple); color: white; }
  .step.done .step-circle { background: var(--correct); color: white; }
  .step-connector { flex: 1; height: 1px; background: #E8E2F8; }

  /* Save indicator */
  .save-note { font-size: 12px; color: var(--text-soft); text-align: center; margin-bottom: 8px; }

  .debug-bar { background: #1a1030; color: #aaa; font-size: 11px; padding: 8px 12px; border-radius: 8px; margin-bottom: 16px; font-family: monospace; }
  .debug-bar strong { color: #9B82E8; }
  .trophy { font-size: 64px; text-align: center; margin: 16px 0; }
  .complete-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
  .complete-stat { background: var(--purple-light); border-radius: 10px; padding: 16px; text-align: center; }
  .complete-stat-num { font-size: 28px; font-weight: 800; color: var(--purple); }
  .complete-stat-label { font-size: 12px; color: var(--text-soft); margin-top: 4px; }

  .fade-in { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>

        explanation: "This is the video deficit effect. Learning from a screen requires representational thinking — connecting a flat image to three-dimensional reality — that the brain is still building before age 2. The deficit is largest at 12 months. The critical variable isn't content quality. It's whether a real person responds to what the child does."

      {
        scenario: "A 2014 study divided toddlers into: live in-person interaction, live video call, or a recording of that same interaction. Which groups learned new vocabulary words?",
        options: [
          { text: "All three groups learned equally — screens are effective with quality content", correct: false },
          { text: "Only the in-person group — any screen, even live, doesn't work before age 2", correct: false },
          { text: "The in-person and live video call groups — the recording group didn't learn the words", correct: true },
          { text: "Only the recording group, because repetition reinforces learning", correct: false }

  {

    diagnosticKey: 'content',
    lesson: {
      story: {
        label: "Jack's Story",
        paragraphs: [
          "When First Son was two and a half, I checked the watch history on the tablet one evening after he went to bed. I didn't recognize half of what was on the list — fast-talking hosts, toy unboxing, something called 'surprise egg videos.' I had been in the room. I hadn't been watching.",
          "With Second Son, my wife and I chose every episode before it played. No autoplay. When he was two, he latched onto a Ms. Rachel episode about shapes and wanted to watch it every day for two weeks. On day twelve, he pointed at the corner of the coffee table and said 'triangle.' My wife didn't say anything. She didn't have to."

const SAVE_KEY = 'ff_adaptive_poc_v3';

function loadState() {
  try { const s = localStorage.getItem(SAVE_KEY); if (s) return JSON.parse(s); } catch(e) {}
  return null;
}
function saveState(s) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch(e) {} }

function freshState() {
  return {
    screen: 'welcome',
    xp: 0,
    diagnosticIndex: 0,
    diagnosticScores: {},
    learningPath: [],
    unitProgress: {},   // unitId → { lessonRead, q1Done, mastered }
    currentUnitId: null,
    currentQ: 1,
    selectedOption: null,
    showFeedback: false,
  };
}

let STATE = loadState() || freshState();

// ============================================================
// HELPERS
// ============================================================

function getUnit(id) { return UNITS.find(u => u.id === id); }

function buildLearningPath(scores) {
  const middle = UNITS.filter(u => u.id !== 'guilt' && u.id !== 'three_rules');
  middle.sort((a, b) => {
    const sA = a.diagnosticKey ? (scores[a.diagnosticKey] || 0) : 0;
    const sB = b.diagnosticKey ? (scores[b.diagnosticKey] || 0) : 0;
    return sA - sB;
  });
  return ['guilt', ...middle.map(u => u.id), 'three_rules'];
}

function isUnitAvailable(unitId) {
  const path = STATE.learningPath;
  const idx = path.indexOf(unitId);
  if (idx === 0) return true;
  return STATE.unitProgress[path[idx - 1]]?.mastered === true;
}

function unitStatus(unitId) {
  const prog = STATE.unitProgress[unitId];
  if (prog?.mastered) return 'completed';
  if (!isUnitAvailable(unitId)) return 'locked';
  const unit = getUnit(unitId);
  const score = unit.diagnosticKey ? (STATE.diagnosticScores[unit.diagnosticKey] || 0) : 0;
  return score === 0 ? 'gap' : 'review';
}

function totalXpPossible() { return UNITS.reduce((s, u) => s + u.xp, 0); }

// ============================================================
// RENDER
// ============================================================

function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }

function render() {
  saveState(STATE);
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.className = 'app fade-in';

  const topBar = el('div', 'top-bar');
  topBar.innerHTML = `<span class="brand">📱 Screen Time Course</span><span class="xp-pill">⚡ ${STATE.xp} XP</span>`;
  app.appendChild(topBar);

  if (!['welcome','diagnostic'].includes(STATE.screen)) {
    const debug = el('div', 'debug-bar');
    debug.innerHTML = `<strong>PoC</strong> · screen: <strong>${STATE.screen}</strong> · xp: <strong>${STATE.xp}</strong> · path: <strong>[${STATE.learningPath.join(' → ')}]</strong>`;
    app.appendChild(debug);
  }

  switch(STATE.screen) {
    case 'welcome':       renderWelcome(app); break;
    case 'diagnostic':    renderDiagnostic(app); break;
    case 'results':       renderResults(app); break;
    case 'map':           renderMap(app); break;
    case 'unit_lesson':   renderUnitLesson(app); break;
    case 'unit':          renderUnit(app); break;
    case 'unit_complete': renderUnitComplete(app); break;
    case 'complete':      renderComplete(app); break;
    default:              renderWelcome(app);
  }
}

function renderDiagnostic(app) {
  const q = DIAGNOSTIC_QUESTIONS[STATE.diagnosticIndex];
  const total = DIAGNOSTIC_QUESTIONS.length;

  const dotRow = el('div', 'dot-row');
  for (let i = 0; i < total; i++) {
    const dot = el('div', 'dot' + (i === STATE.diagnosticIndex ? ' active' : i < STATE.diagnosticIndex ? ' done' : ''));
    dotRow.appendChild(dot);
  }
  app.appendChild(dotRow);

  const card = el('div', 'card');
  card.innerHTML = `
    <div class="eyebrow">Diagnostic · ${STATE.diagnosticIndex + 1} of ${total}</div>
    <h2>${q.question}</h2>
    <p style="font-size:12px;margin-top:4px">No feedback here — answers shape your learning path.</p>
  `;

  const opts = el('div', 'options');
  q.options.forEach(opt => {
    const btn = el('button', 'option');
    btn.textContent = opt.text;
    btn.onclick = () => {
      STATE.diagnosticScores[q.key] = opt.score;
      STATE.diagnosticIndex++;
      if (STATE.diagnosticIndex >= DIAGNOSTIC_QUESTIONS.length) {
        STATE.learningPath = buildLearningPath(STATE.diagnosticScores);
        STATE.screen = 'results';
      }
      render();
    };
    opts.appendChild(btn);
  });

  card.appendChild(opts);
  app.appendChild(card);
}

  STATE.learningPath.forEach((unitId, idx) => {
    const unit = getUnit(unitId);
    const status = unitStatus(unitId);
    const prog = STATE.unitProgress[unitId] || {};
    const isAvail = isUnitAvailable(unitId);

    const btn = el('button', `unit-card ${status}`);
    if (!isAvail) btn.disabled = true;

    let badge = '';
    if (status === 'completed')  badge = `<span class="unit-badge badge-done">✓ Done</span>`;
    else if (status === 'gap')   badge = `<span class="unit-badge badge-gap">Gap</span>`;

    else                         badge = `<span class="unit-badge badge-locked">🔒</span>`;

    let stepNote = '';
    if (isAvail && status !== 'completed') {
      if (!prog.lessonRead) stepNote = ' · Start: Read lesson';
      else if (!prog.q1Done) stepNote = ' · Next: Q1';
      else stepNote = ' · Next: Mastery check (Q2)';
    }

    btn.innerHTML = `
      <div class="unit-icon">${unit.icon}</div>
      <div class="unit-meta">
        <div class="unit-title">${idx + 1}. ${unit.title}</div>
        <div class="unit-sub">${unit.chapter}${stepNote}</div>

      if (!isAvail) return;

      render();

  card.appendChild(conceptBlock);

  // Key takeaway
  const kt = el('div', 'key-takeaway');
  const ktLabel = el('div', 'key-takeaway-label'); ktLabel.textContent = '🎯 Key Takeaway';
  kt.appendChild(ktLabel);
  const ktText = el('div'); ktText.textContent = lesson.keyTakeaway;
  kt.appendChild(ktText);
  card.appendChild(kt);

  const xpNote = el('p');
  xpNote.style.fontSize = '13px'; xpNote.style.marginTop = '12px';
  xpNote.innerHTML = `<em>Answer both questions correctly to earn <strong>${unit.xp} XP</strong> and unlock the next lesson.</em>`;
  card.appendChild(xpNote);

  const btn = el('button', 'btn btn-primary');
  btn.textContent = '→ Test My Understanding (Q1 of 2)';
  btn.onclick = () => {
    STATE.unitProgress[STATE.currentUnitId] = { ...(STATE.unitProgress[STATE.currentUnitId] || {}), lessonRead: true };
    STATE.currentQ = 1;
    STATE.selectedOption = null;
    STATE.showFeedback = false;
    STATE.screen = 'unit';
    render();
  };
  card.appendChild(btn);

  const backBtn = el('button', 'btn btn-secondary');
  backBtn.style.marginTop = '8px';
  backBtn.textContent = '← Back to Map';
  backBtn.onclick = () => { STATE.screen = 'map'; render(); };
  card.appendChild(backBtn);

  app.appendChild(card);
}

// ============================================================
// QUESTION
// ============================================================

function renderUnit(app) {
  const unit = getUnit(STATE.currentUnitId);
  const q = unit.questions[STATE.currentQ - 1];
  const isQ2 = STATE.currentQ === 2;

  renderStepTracker(app, isQ2 ? 'q2' : 'q1');

  const card = el('div', 'card');

  const eyebrow = el('div', 'eyebrow');
  eyebrow.textContent = `${unit.chapter} · ${unit.icon} ${unit.title}`;
  card.appendChild(eyebrow);

  if (isQ2 && !STATE.showFeedback) {
    const gate = el('div');
    gate.style.cssText = 'background:var(--purple-light);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--purple-dark)';
    gate.innerHTML = `🎯 <strong>Mastery gate</strong> — get this right to earn ${unit.xp} XP and unlock the next lesson.`;
    card.appendChild(gate);
  }

  const scenLabel = el('div', 'eyebrow'); scenLabel.style.marginBottom = '8px'; scenLabel.textContent = 'Scenario';
  card.appendChild(scenLabel);

  const scenText = el('div');
  scenText.style.cssText = 'font-size:16px;font-weight:600;line-height:1.55;color:var(--text);margin-bottom:4px';
  scenText.textContent = q.scenario;
  card.appendChild(scenText);

  const opts = el('div', 'options');
  q.options.forEach((opt, i) => {
    const btn = el('button', 'option');
    if (STATE.showFeedback) {
      if (opt.correct) btn.className += ' correct';
      else if (i === STATE.selectedOption) btn.className += ' wrong';
      btn.disabled = true;
    } else if (STATE.selectedOption === i) {
      btn.className += ' selected';
    }
    btn.textContent = opt.text;
    btn.onclick = () => { if (STATE.showFeedback) return; STATE.selectedOption = i; render(); };
    opts.appendChild(btn);
  });
  card.appendChild(opts);

  if (STATE.showFeedback) {
    const isCorrect = q.options[STATE.selectedOption]?.correct;
    const fb = el('div', `feedback-box feedback-${isCorrect ? 'correct' : 'wrong'}`);
    fb.innerHTML = `<span class="feedback-icon">${isCorrect ? '✅' : '❌'}</span><div class="feedback-title">${isCorrect ? 'Correct!' : 'Not quite.'}</div><div>${q.explanation}</div>`;
    card.appendChild(fb);

    const nextBtn = el('button', `btn ${isCorrect ? 'btn-primary' : 'btn-secondary'}`);
    if (isCorrect) {
      if (isQ2) {
        nextBtn.textContent = `🏆 Claim ${unit.xp} XP →`;
        nextBtn.onclick = () => {
          STATE.xp += unit.xp;
          STATE.unitProgress[STATE.currentUnitId] = { lessonRead: true, q1Done: true, mastered: true };
          STATE.screen = 'unit_complete';
          render();
        };
      } else {
        nextBtn.textContent = '→ Mastery Check (Q2 of 2)';
        nextBtn.onclick = () => {
          STATE.unitProgress[STATE.currentUnitId] = { ...(STATE.unitProgress[STATE.currentUnitId] || {}), q1Done: true };
          STATE.currentQ = 2; STATE.selectedOption = null; STATE.showFeedback = false;
          render();
        };
      }
    } else {
      nextBtn.textContent = '↺ Try Again';
      nextBtn.onclick = () => { STATE.selectedOption = null; STATE.showFeedback = false; render(); };

      const reviewBtn = el('button', 'btn btn-secondary');
      reviewBtn.style.marginTop = '8px';
      reviewBtn.textContent = '📖 Re-read the Lesson';
      reviewBtn.onclick = () => { STATE.screen = 'unit_lesson'; STATE.selectedOption = null; STATE.showFeedback = false; render(); };
      card.appendChild(nextBtn);
      card.appendChild(reviewBtn);
      app.appendChild(card);
      return;
    }
    card.appendChild(nextBtn);

  } else {
    const commitBtn = el('button', 'btn btn-primary');
    commitBtn.textContent = 'Commit to Answer';
    commitBtn.disabled = STATE.selectedOption === null;
    commitBtn.onclick = () => { STATE.showFeedback = true; render(); };
    card.appendChild(commitBtn);

    const backBtn = el('button', 'btn btn-secondary');
    backBtn.style.marginTop = '8px';
    backBtn.textContent = '← Back to Map';
    backBtn.onclick = () => { STATE.screen = 'map'; render(); };
    card.appendChild(backBtn);
  }

  app.appendChild(card);
}

// ============================================================
// STEP TRACKER
// ============================================================

function renderStepTracker(app, active) {
  const steps = [{ key: 'lesson', label: 'Read' }, { key: 'q1', label: 'Q1' }, { key: 'q2', label: 'Q2 (Mastery)' }];
  const order = ['lesson', 'q1', 'q2'];
  const activeIdx = order.indexOf(active);
  const track = el('div', 'step-track');
  steps.forEach((step, i) => {
    const isDone = i < activeIdx;
    const isActive = i === activeIdx;
    const s = el('div', 'step' + (isActive ? ' active' : isDone ? ' done' : ''));
    const circle = el('div', 'step-circle'); circle.textContent = isDone ? '✓' : i + 1;
    s.appendChild(circle);
    const label = el('span'); label.textContent = step.label; s.appendChild(label);
    track.appendChild(s);
    if (i < steps.length - 1) { track.appendChild(el('div', 'step-connector')); }
  });
  app.appendChild(track);
}

// ============================================================
// UNIT COMPLETE
// ============================================================

function renderUnitComplete(app) {
  const unit = getUnit(STATE.currentUnitId);
  const allDone = STATE.learningPath.every(id => STATE.unitProgress[id]?.mastered);

  const card = el('div', 'card');
  card.innerHTML = `
    <div class="eyebrow" style="text-align:center">Lesson Complete 🎉</div>
    <h2 style="text-align:center;margin-top:4px">${unit.icon} ${unit.title}</h2>
  `;

  const burst = el('div', 'xp-burst');
  burst.innerHTML = `<span class="xp-big">+${unit.xp}</span><div class="xp-label">XP Earned · Total: ${STATE.xp} / ${totalXpPossible()} XP</div>`;
  card.appendChild(burst);

  card.appendChild(el('div', 'divider'));

  // Overall progress bar
  const mastered = STATE.learningPath.filter(id => STATE.unitProgress[id]?.mastered).length;
  const pct = Math.round((mastered / STATE.learningPath.length) * 100);
  const progWrap = el('div', 'progress-wrap');
  progWrap.innerHTML = `<div class="progress-label"><span>Course Progress</span><span>${pct}% · ${mastered} of ${STATE.learningPath.length} done</span></div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
  card.appendChild(progWrap);

  const btn = el('button', 'btn btn-primary');
  if (allDone) {
    btn.textContent = '🏆 See Final Results';
    btn.onclick = () => { STATE.screen = 'complete'; render(); };
  } else {
    const nextId = STATE.learningPath.find(id => !STATE.unitProgress[id]?.mastered);
    const nextUnit = nextId ? getUnit(nextId) : null;
    btn.textContent = nextUnit ? `→ Next: ${nextUnit.icon} ${nextUnit.title}` : '→ Back to Map';
    btn.onclick = () => {
      if (nextId) { STATE.currentUnitId = nextId; STATE.selectedOption = null; STATE.showFeedback = false; STATE.screen = 'unit_lesson'; }
      else { STATE.screen = 'map'; }
      render();
    };
  }
  card.appendChild(btn);

  const mapBtn = el('button', 'btn btn-secondary');
  mapBtn.style.marginTop = '8px';
  mapBtn.textContent = '⊞ View Map';
  mapBtn.onclick = () => { STATE.screen = 'map'; render(); };
  card.appendChild(mapBtn);

  app.appendChild(card);
}

// ============================================================
// COMPLETE
// ============================================================

function renderComplete(app) {
  const card = el('div', 'card');
  card.innerHTML = `
    <div class="trophy">🏆</div>
    <div class="eyebrow" style="text-align:center">Course Complete</div>
    <h1 style="text-align:center;font-size:22px">You've Mastered the Screen Time Playbook</h1>
    <p style="text-align:center;margin-top:8px">8 lessons. 2/2 mastery on every one. ${STATE.xp} XP.</p>
    <div class="divider"></div>
    <h3>The Three Rules — Your Takeaway</h3>
  `;
  [
    '🚫 Contingency: Never use screens to stop tantrums. Build the emotional regulation skill instead.',
    '📺 Quality: Slow-paced, language-rich content. Under 3 scene cuts per minute. You choose it. You watch it with them.',
    "⏰ Timing: No screens before meals, sleep, or outdoor play. These are what screens displace — and they're what matter most."
  ].forEach(rule => {
    const p = el('p'); p.style.marginTop = '10px'; p.innerHTML = rule; card.appendChild(p);
  });

  const btn = el('button', 'btn btn-primary');
  btn.style.marginTop = '20px'; btn.textContent = '↩ Back to Map'; btn.onclick = () => { STATE.screen = 'map'; render(); };
  card.appendChild(btn);
  app.appendChild(card);
}

// ============================================================
// BOOT
// ============================================================
render();
</script>
</body>
</html>
