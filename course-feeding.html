<style>
:root {
  --sans:'Outfit',system-ui,sans-serif; --serif:'Instrument Serif',Georgia,serif;
  --terra:#6E4ED6; --terra-dark:#5B3CC4; --terra-light:#9B80FF;
  --terra-tint:#EDE9FB; --terra-tint2:#F5F3FF;
  --bg:#F8F7FF; --surface:#FFFFFF; --elevated:#F3F0FF;
  --text:#0D0820; --text-mid:#4A4560; --text-dim:#8B85A8;
  --border:rgba(110,78,214,.12); --border-light:rgba(110,78,214,.07);
  --correct:#22c55e; --correct-bg:#F0FDF4; --correct-border:#86efac;
  --wrong:#ef4444; --wrong-bg:#FEF2F2; --wrong-border:#fca5a5;
  --radius-pill:100px; --radius-card:20px; --radius-sm:12px;
  --shadow-card:0 2px 16px rgba(110,78,214,.08); --ease:cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;}
html:not(.authed) body>*{visibility:hidden;}
html:not(.authed) .auth-loading{visibility:visible;}
.auth-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:14px;color:var(--text-dim);}
html.authed .auth-loading{display:none;}
.course-header{position:sticky;top:0;z-index:100;background:rgba(248,247,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border-light);height:60px;display:flex;align-items:center;}
.header-inner{width:min(680px,100% - 40px);margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.header-logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;color:var(--text);text-decoration:none;flex-shrink:0;}
.logo-chevron{flex-shrink:0;}.logo-f{color:var(--text);font-weight:600;letter-spacing:-.02em;}.logo-s{color:var(--terra);font-weight:600;letter-spacing:-.02em;}
.header-back{font-size:13px;font-weight:600;color:var(--text-mid);text-decoration:none;display:flex;align-items:center;gap:5px;transition:color .15s;flex-shrink:0;}
.header-back:hover{color:var(--terra);}
.header-course-name{font-size:13px;font-weight:600;color:var(--text-mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:center;}
@media(max-width:480px){.header-course-name{display:none;}}
.main{width:min(600px,100% - 40px);margin-inline:auto;padding:32px 0 80px;}
.progress-section{margin-bottom:28px;}
.progress-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.progress-label{font-size:12px;font-weight:600;color:var(--text-dim);}
.progress-pct{font-size:12px;font-weight:700;color:var(--terra);}
.progress-bar-wrap{height:5px;background:var(--terra-tint);border-radius:99px;overflow:hidden;margin-bottom:14px;}
.progress-bar-fill{height:100%;background:var(--terra);border-radius:99px;transition:width .5s var(--ease);}
.roadmap{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.roadmap::-webkit-scrollbar{display:none;}
.roadmap-ch{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;width:60px;opacity:.35;transition:opacity .2s;}
.roadmap-ch.done,.roadmap-ch.current{opacity:1;}
.roadmap-icon{width:34px;height:34px;border-radius:50%;background:var(--terra-tint);display:flex;align-items:center;justify-content:center;font-size:16px;border:2px solid transparent;position:relative;transition:all .2s;flex-shrink:0;}
.roadmap-ch.done .roadmap-icon{background:var(--correct-bg);border-color:var(--correct);}
.roadmap-ch.done .roadmap-icon::after{content:'✓';position:absolute;bottom:-3px;right:-3px;width:14px;height:14px;background:var(--correct);color:white;border-radius:50%;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;}
.roadmap-ch.current .roadmap-icon{background:var(--terra-tint);border-color:var(--terra);box-shadow:0 0 0 3px rgba(110,78,214,.15);}
.roadmap-label{font-size:9px;font-weight:600;color:var(--text-dim);text-align:center;line-height:1.3;max-width:60px;}
.roadmap-ch.current .roadmap-label{color:var(--terra);font-weight:700;}
.roadmap-ch.done .roadmap-label{color:var(--text-mid);}
.card{background:var(--surface);border-radius:var(--radius-card);padding:32px;box-shadow:var(--shadow-card);border:1px solid var(--border-light);margin-bottom:16px;}.cert-card-wrap{background:transparent;border:none;box-shadow:none;padding:8px 0 0;margin-bottom:16px;}
.card-sm{padding:24px;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--terra);margin-bottom:8px;}
h1{font-family:var(--serif);font-size:clamp(28px,5vw,36px);line-height:1.15;color:var(--text);font-weight:400;}
h2{font-family:var(--serif);font-size:clamp(22px,4vw,28px);line-height:1.2;color:var(--text);font-weight:400;margin-bottom:6px;}
h3{font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px;}
p{font-size:15px;line-height:1.75;color:var(--text-mid);}
p+p{margin-top:12px;}
.divider{height:1px;background:var(--border-light);margin:24px 0;}
.welcome-badge{width:72px;height:72px;border-radius:20px;background:var(--terra-tint);margin-bottom:20px;display:flex;align-items:center;justify-content:center;font-size:36px;}
.stat-row{display:flex;gap:10px;margin:24px 0;}
.stat-box{flex:1;background:var(--terra-tint2);border-radius:var(--radius-sm);padding:16px 10px;text-align:center;border:1px solid var(--border-light);}
.stat-num{font-size:22px;font-weight:800;color:var(--terra);}
.stat-lbl{font-size:11px;color:var(--text-dim);margin-top:3px;font-weight:600;}
.how-step{display:flex;gap:14px;align-items:flex-start;padding:12px 0;}
.how-step+.how-step{border-top:1px solid var(--border-light);}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--terra);color:white;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.step-text{font-size:15px;color:var(--text-mid);line-height:1.55;}
.step-text strong{color:var(--text);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--sans);font-weight:700;font-size:15px;border:none;border-radius:var(--radius-pill);padding:14px 28px;cursor:pointer;width:100%;transition:background .2s,transform .15s,opacity .15s;text-decoration:none;}
.btn-primary{background:var(--terra);color:white;}
@media(hover:hover){.btn-primary:hover{background:var(--terra-dark);transform:translateY(-1px);}}
.btn-secondary{background:transparent;color:var(--terra-dark);border:1.5px solid var(--terra);}
@media(hover:hover){.btn-secondary:hover{background:var(--terra-tint);}}
.btn-ghost{background:var(--terra-tint);color:var(--terra-dark);}
@media(hover:hover){.btn-ghost:hover{background:var(--elevated);}}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;}
.btn+.btn{margin-top:10px;}
.btn-sm{font-size:13px;padding:10px 20px;width:auto;}
.btn-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
.story-block{border-left:3px solid rgba(110,78,214,.3);padding:18px 22px;margin:22px 0;background:rgba(248,247,255,.7);border-radius:0 12px 12px 0;}
.story-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--terra-light);margin-bottom:10px;}
.story-block p{font-style:italic;color:var(--text);font-size:15px;line-height:1.8;}
.story-block p+p{margin-top:12px;}
.science-block{background:var(--terra-tint);border-radius:var(--radius-sm);padding:18px 20px;margin:18px 0;}
.science-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--terra);margin-bottom:8px;}
.science-block p{color:var(--text);font-style:normal;}
.takeaway{background:var(--terra);color:white;border-radius:var(--radius-sm);padding:16px 20px;margin:18px 0;font-size:14px;font-weight:600;line-height:1.6;}
.takeaway-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.65;margin-bottom:5px;}
.question-card{background:var(--surface);border-radius:var(--radius-card);border-top:3px solid var(--terra);padding:28px;box-shadow:var(--shadow-card);border-left:1px solid var(--border-light);border-right:1px solid var(--border-light);border-bottom:1px solid var(--border-light);margin-bottom:16px;}
.q-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--terra);margin-bottom:12px;}
.q-text{font-size:16px;font-weight:600;line-height:1.55;color:var(--text);margin-bottom:4px;}
.options{display:flex;flex-direction:column;gap:10px;margin:20px 0;}
.option{border:2px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px;cursor:pointer;font-size:14px;line-height:1.5;color:var(--text);background:var(--surface);text-align:left;transition:border-color .15s,background .15s;font-family:var(--sans);width:100%;}
@media(hover:hover){.option:hover:not(:disabled){border-color:var(--terra-light);background:var(--terra-tint);}}
.option.selected{border-color:var(--terra);background:var(--terra-tint);color:var(--terra-dark);font-weight:600;}
.option.correct{border-color:var(--correct);background:var(--correct-bg);color:#15803d;font-weight:600;}
.option.wrong{border-color:var(--wrong);background:var(--wrong-bg);color:#b91c1c;}
.option:disabled{cursor:default;}
.feedback{border-radius:var(--radius-sm);padding:16px 18px;font-size:14px;line-height:1.7;margin-top:4px;}
.feedback-correct{background:var(--correct-bg);border:1px solid var(--correct-border);color:#166534;}
.feedback-wrong{background:var(--wrong-bg);border:1px solid var(--wrong-border);color:#991b1b;}
.feedback-title{font-weight:700;margin-bottom:4px;font-size:15px;}
.try-this{border:2px solid var(--correct);border-radius:var(--radius-sm);padding:16px 18px;margin-top:14px;background:var(--correct-bg);}
.try-this-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#16a34a;margin-bottom:6px;}
.try-this-text{font-size:14px;line-height:1.65;color:#166534;font-weight:500;}
.cert-outer{background:white;border:2px solid var(--terra);border-radius:20px;padding:44px 48px 36px;text-align:center;position:relative;overflow:hidden;max-width:460px;margin:0 auto;}
.cert-outer::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at top,rgba(110,78,214,.05) 0%,transparent 60%);pointer-events:none;}
.cert-seal{width:80px;height:80px;border-radius:50%;background:var(--terra);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:36px;color:white;box-shadow:0 6px 24px rgba(110,78,214,.3);}
.cert-pretitle{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;}
.cert-title{font-family:var(--serif);font-size:clamp(22px,4vw,30px);color:var(--text);margin-bottom:20px;line-height:1.2;}
.cert-name-wrap{margin:16px auto;max-width:380px;}
.cert-name-label{font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
.cert-name-input{border:none;border-bottom:2px solid var(--terra);background:transparent;font-family:var(--serif);font-size:24px;color:var(--terra-dark);font-style:italic;text-align:center;width:100%;padding:6px 0;outline:none;}
.cert-name-input::placeholder{color:var(--terra-tint);font-style:italic;}
.cert-rule{width:80px;height:2px;background:var(--terra-tint);margin:22px auto;border-radius:99px;}
.cert-body{font-size:14px;color:var(--text-mid);line-height:1.7;max-width:340px;margin-inline:auto;}
.cert-sig-row{display:flex;justify-content:center;margin-top:32px;}
.cert-sig{text-align:center;}
.cert-sig-line{width:130px;height:1px;background:var(--border);margin:0 auto 8px;}
.cert-sig-name{font-size:15px;font-weight:700;color:var(--text);}
.cert-sig-role{font-size:12px;color:var(--text-dim);margin-top:2px;}
.cert-date{font-size:12px;color:var(--text-dim);margin-top:22px;}
.cert-site-url{font-size:11px;color:var(--text-ghost);margin-top:8px;letter-spacing:.04em;}
.action-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.action-item{display:flex;align-items:flex-start;gap:12px;background:var(--correct-bg);border:1px solid var(--correct-border);border-radius:var(--radius-sm);padding:12px 14px;}
.action-num{width:24px;height:24px;border-radius:50%;background:var(--correct);color:white;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.action-body{font-size:14px;line-height:1.55;color:#166534;}
.action-chapter{font-size:11px;font-weight:700;color:#16a34a;margin-bottom:2px;}
.rule-item{display:flex;gap:14px;align-items:flex-start;padding:14px 0;}
.rule-item+.rule-item{border-top:1px solid var(--border-light);}
.rule-icon{font-size:22px;flex-shrink:0;line-height:1.4;}
.rule-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px;}
.rule-desc{font-size:14px;color:var(--text-mid);line-height:1.55;}
.save-note{font-size:12px;color:var(--text-dim);text-align:center;padding-top:4px;}
.fade-in{animation:fadeIn .3s var(--ease);}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:768px){.roadmap{padding:2px 2px 6px;scroll-padding-inline:12px;gap:8px;}.roadmap-icon{width:38px;height:38px;font-size:17px;}.roadmap-ch{width:64px;}}
@media(max-width:480px){
  .main{width:calc(100% - 32px);padding-top:24px;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));}
  .card{padding:20px;border-radius:16px;}.card-sm{padding:16px;border-radius:16px;}.question-card{padding:20px;border-radius:16px;}
  .progress-section{margin-bottom:20px;}.welcome-badge{width:60px;height:60px;font-size:28px;border-radius:16px;margin-bottom:16px;}
  .stat-box{padding:12px 8px;}.stat-num{font-size:19px;}.stat-lbl{font-size:10px;}.divider{margin:18px 0;}.step-text{font-size:14px;}
  .story-block{padding:14px 16px;margin:18px 0;}.story-block p{font-size:14px;}.science-block{padding:14px 16px;}.science-block p{font-size:14px;}
  .takeaway{padding:14px 16px;font-size:13px;}.q-text{font-size:15px;}.options{gap:8px;margin:16px 0;}.option{padding:12px 14px;}
  .feedback{padding:14px 16px;font-size:14px;}.feedback-title{font-size:14px;}.try-this{padding:14px 16px;}.try-this-text{font-size:13px;}
  .btn-row{flex-direction:column;gap:8px;}.btn-row .btn{width:100%;}.btn-sm{font-size:14px;padding:12px 20px;}
  .cert-name-input{font-size:20px;}.cert-body{font-size:13px;}.action-item{padding:10px 12px;}.action-body{font-size:13px;}
}
@media(max-width:360px){
  .main{width:calc(100% - 24px);}.card{padding:16px;}.question-card{padding:16px;}
  .stat-row{flex-wrap:wrap;}.stat-box{flex:1 1 calc(50% - 6px);}.stat-box:last-child{flex:1 1 100%;padding:10px;}.stat-num{font-size:18px;}
  .roadmap-ch{width:52px;}.roadmap-icon{width:32px;height:32px;font-size:14px;}.cert-name-input{font-size:18px;}
}
@media print{
  .no-print{display:none!important;}.course-header{display:none!important;}
  body{background:white;}.main{width:100%;padding:0;}
  .cert-outer::before{display:none!important;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .cert-outer{border:2px solid #5B3CC4;box-shadow:none;padding:40px;}
  .cert-seal{background:#6E4ED6!important;color:white!important;box-shadow:none;}
  .cert-name-input{border:none!important;border-bottom:2px solid #5B3CC4!important;font-size:22px!important;color:#5B3CC4!important;}
  .card{box-shadow:none;border:none;}
}

/* ─── CELEBRATION OVERLAY ─── */
.celebration-overlay{position:fixed;inset:0;z-index:9999;background:rgba(16,8,40,0.94);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s ease;}
.confetti-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.celebration-inner{position:relative;text-align:center;color:#fff;}
.celebration-check{width:88px;height:88px;border-radius:50%;background:var(--terra);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;margin:0 auto 20px;animation:cel-pop .45s cubic-bezier(.175,.885,.32,1.275) forwards;}
.celebration-title{font-size:22px;font-weight:700;letter-spacing:.06em;font-family:var(--sans);}
@keyframes cel-pop{0%{transform:scale(0)}100%{transform:scale(1)}}

/* ─── ACHIEVEMENT HERO ─── */
.achievement-hero{text-align:center;padding:44px 32px 36px;animation:fade-up .6s ease forwards;}
.achievement-badge-icon{font-size:64px;display:block;margin-bottom:18px;animation:badge-drop .5s .15s cubic-bezier(.175,.885,.32,1.275) both;}
@keyframes badge-drop{0%{transform:scale(0) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.achievement-headline{font-size:28px;font-weight:800;line-height:1.25;margin-bottom:14px;color:var(--text);}
.achievement-headline span{color:var(--terra);}
.achievement-stats{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;color:var(--text-dim);font-weight:500;}
.achievement-stats .stat-dot{color:var(--border);}
@keyframes fade-up{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
@media(max-width:480px){.achievement-headline{font-size:22px;}}

/* ─── SHARE MOMENT ─── */
.share-moment{padding:28px;}
.share-moment-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-ghost);margin-bottom:16px;}
.share-card-visual{background:linear-gradient(135deg,#120830 0%,#2a1060 100%);border-radius:16px;padding:28px 24px;text-align:center;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(110,78,214,.3);}
.share-card-visual::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(110,78,214,.35),transparent 70%);pointer-events:none;}
.sc-logo{position:relative;font-size:11px;font-weight:700;color:rgba(255,255,255,.55);margin-bottom:18px;display:flex;align-items:center;justify-content:center;gap:5px;letter-spacing:.06em;}
.sc-badge{position:relative;font-size:52px;margin-bottom:14px;display:block;}
.sc-course{position:relative;font-size:17px;font-weight:700;color:#fff;margin-bottom:4px;font-family:var(--serif);}
.sc-sub{position:relative;font-size:10px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.1em;margin-bottom:18px;}

    science:"Responsive feeding means following the baby's hunger and fullness cues rather than a clock or a volume target. Hunger cues: rooting (turning head, mouth open), sucking on hands, bringing fists to mouth, escalating fussiness. Fullness cues: turning head away, releasing the nipple repeatedly, slowing the sucking pace, going slack in the arms, becoming calm without finishing the feed. A 2017 University of Leeds study filmed 27 mother-infant pairs and identified 22 distinct cues infants use during feeding. Breastfed infants show more of these cues more frequently because breastfeeding requires active participation to continue milk flow — formula doesn't have this built-in feedback loop. The research linking responsive feeding to lower obesity risk is consistent and replicated across multiple studies. A baby whose fullness signal is consistently respected maintains better caloric self-regulation into childhood. A baby pushed past fullness learns to eat past fullness. That habit does not fix itself at age two.",

    science:"Iron deficiency in infancy causes lasting neurodevelopmental damage — lower cognitive scores, behavioral problems, and motor delays that do not fully reverse even after iron levels are restored. This is the finding of a 2010 AAP clinical report (Baker & Greer) reviewing multiple longitudinal studies. A 2020 RCT (Awasthi et al.) found iron-fortified cereal in 160 infants produced 9.7 g/L higher hemoglobin, 45% lower anemia rate, and significantly better language and motor scores at 12 months. Your first solid foods should be iron-rich. Heme iron (from meat) is absorbed at 15–35% efficiency. Non-heme iron (from plants) at 5–12% — pair it with Vitamin C to double or triple absorption. High-iron first foods: pureed meat (chicken, beef, lamb), pureed lentils or beans, iron-fortified oat cereal, egg yolk, chicken liver (the highest iron density of any food — 13mg per 100g). A note on rice cereal: it is iron-fortified, which helps, but it is also the highest-arsenic food in the commercial baby food category. The CDC, AAP, and FDA now all recommend oat or barley cereals instead.",

    science:"Baby-led weaning (BLW) means the baby feeds themselves from the start — finger foods, self-feeding, baby leads the quantity. The BLISS trial (Daniels et al., University of Otago, 206 families) found no significant difference in choking incidents between BLW and traditional spoon-feeding, no difference in iron status when iron-rich first foods were included, and better satiety responsiveness in BLW infants at 12 and 24 months — meaning they were better at stopping when full. What the research actually supports isn't a strict method. It's a principle: the baby decides whether to eat and how much. The parent decides what's on offer. Gagging vs. choking: gagging is a protective reflex. In infants, the gag reflex is positioned much further forward in the mouth than in adults — it's designed to prevent swallowing what shouldn't be swallowed yet. Baby gags, face goes red, alarming sounds, sorts it out in 3–5 seconds. This is the system working. Choking: baby cannot make sound, color is changing, airway is blocked — this is 911. Texture timeline: 6–7m smooth purees; 8–9m lumpy mashed + soft finger foods; 10–12m chopped soft table food; 12m+ family food. Delaying texture progression past 9 months is a documented risk factor for texture aversion at 12 months (Coulthard et al.).",

// STATE
// ═══════════════════════════════════════════════════════════
const SAVE_KEY='ff_course_feeding_v1';
function loadState(){try{const s=localStorage.getItem(SAVE_KEY);if(s)return JSON.parse(s);}catch(e){}return null;}
function saveState(s){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(s));}catch(e){}
  if(window.ffSync){window.ffSync.getUserId().then(uid=>{if(uid)window.ffSync.syncState(uid,'feeding',s);});}
}
function freshState(){return{screen:'welcome',chapterIndex:0,completed:[],selectedOption:null,showFeedback:false};}
let STATE=loadState()||freshState();

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
function el(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e;}
function ch(){return CHAPTERS[STATE.chapterIndex];}
function done(id){return STATE.completed.includes(id);}
function pct(){return Math.round((STATE.completed.length/CHAPTERS.length)*100);}
function userName(){return localStorage.getItem('ff_user_name')||window._sbUserEmail||'';}

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════
function render(){
  saveState(STATE);
  const app=document.getElementById('app');
  app.innerHTML='';app.className='main fade-in';
  if(STATE.screen==='chapter'||STATE.screen==='question')renderProgress(app);
  switch(STATE.screen){
    case'welcome':renderWelcome(app);break;
    case'chapter':renderChapter(app);break;
    case'question':renderQuestion(app);break;
    case'complete':renderComplete(app);break;
  }
}

function renderProgress(app){
  const wrap=el('div','progress-section no-print');
  const meta=el('div','progress-meta');
  const lbl=el('span','progress-label');lbl.textContent=`Chapter ${STATE.chapterIndex+1} of ${CHAPTERS.length}`;
  const pctLbl=el('span','progress-pct');pctLbl.textContent=pct()+'% complete';
  meta.appendChild(lbl);meta.appendChild(pctLbl);wrap.appendChild(meta);
  const barWrap=el('div','progress-bar-wrap');
  const fill=el('div','progress-bar-fill');fill.style.width=pct()+'%';
  barWrap.appendChild(fill);wrap.appendChild(barWrap);
  const roadmap=el('div','roadmap');
  CHAPTERS.forEach((c,i)=>{
    const isDone=done(c.id),isCurrent=i===STATE.chapterIndex;
    const chip=el('div','roadmap-ch'+(isDone?' done':isCurrent?' current':''));
    const icon=el('div','roadmap-icon');icon.textContent=c.icon;chip.appendChild(icon);
    const lbl2=el('div','roadmap-label');lbl2.textContent=(c.short||c.title).replace('\n',' ');lbl2.title=c.title;chip.appendChild(lbl2);
    roadmap.appendChild(chip);
  });
  wrap.appendChild(roadmap);
  setTimeout(()=>{const chips=roadmap.querySelectorAll('.roadmap-ch');if(chips[STATE.chapterIndex])chips[STATE.chapterIndex].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});},60);
  app.appendChild(wrap);
}

function renderWelcome(app){
  const card=el('div','card');
  const badge=el('div','welcome-badge');badge.textContent='🍽️';card.appendChild(badge);
  const ey=el('div','eyebrow');ey.textContent='FamilyForce · Feeding';card.appendChild(ey);
  const title=el('h1');title.textContent='The Feeding Playbook';card.appendChild(title);
  const sub=el('p');sub.style.marginTop='12px';
  sub.textContent='A research-backed course on getting feeding right from the start — milk phase, flavor window, and the toddler years. 13 chapters, one question each, earn your certificate.';card.appendChild(sub);
  const stats=el('div','stat-row');
  [['13','Chapters'],['~65','Minutes'],['1','Certificate']].forEach(([num,lbl])=>{
    const box=el('div','stat-box');
    const n=el('div','stat-num');n.textContent=num;box.appendChild(n);
    const l=el('div','stat-lbl');l.textContent=lbl;box.appendChild(l);stats.appendChild(box);
  });card.appendChild(stats);
  card.appendChild(el('div','divider'));
  const h=el('h3');h.textContent='How each chapter works';card.appendChild(h);
  [["Jack's story","A real moment from feeding First Son vs. Second Son. The moment that made it real."],
   ["The science","What the research actually shows — specific, actionable, not a headline."],
   ["One question","Answer it correctly to unlock the next chapter. Get it wrong: review and try again."],
   ["Try This","One specific action to do before moving on."]
  ].forEach(([t,d],i)=>{
    const step=el('div','how-step');
    const num=el('div','step-num');num.textContent=i+1;step.appendChild(num);
    const text=el('div','step-text');text.innerHTML=`<strong>${t}</strong> — ${d}`;step.appendChild(text);
    card.appendChild(step);
  });
  const hasProg=STATE.completed.length>0;
  if(hasProg){
    const resume=el('button','btn btn-primary');resume.style.marginTop='24px';
    resume.textContent=`↩  Resume — Chapter ${STATE.chapterIndex+1}`;
    resume.onclick=()=>{STATE.screen='chapter';render();};card.appendChild(resume);
    const restart=el('button','btn btn-secondary');restart.textContent='→  Start from Chapter 1';
    restart.onclick=()=>{STATE.chapterIndex=0;STATE.screen='chapter';render();};card.appendChild(restart);
    const reset=el('button','btn btn-ghost');reset.style.color='var(--text-dim)';reset.textContent='↺  Clear Progress';
    reset.onclick=()=>{if(confirm('Clear all progress?')){STATE=freshState();render();}};card.appendChild(reset);
  }else{
    const start=el('button','btn btn-primary');start.style.marginTop='24px';start.textContent='→  Start Course';
    start.onclick=()=>{STATE.screen='chapter';render();};card.appendChild(start);
  }
  app.appendChild(card);app.appendChild(mkSaveNote());
}

function renderChapter(app){
  const c=ch();const card=el('div','card');
  const ey=el('div','eyebrow');ey.textContent=`${c.chapter} · ${c.icon} ${c.title}`;card.appendChild(ey);
  const story=el('div','story-block');
  const slbl=el('div','story-label');slbl.textContent="Jack's Story";story.appendChild(slbl);
  c.story.paragraphs.forEach(t=>{const p=el('p');p.textContent=t;story.appendChild(p);});card.appendChild(story);
  const sci=el('div','science-block');
  const sciLbl=el('div','science-label');sciLbl.textContent='The Science';sci.appendChild(sciLbl);
  const sciP=el('p');sciP.textContent=c.science;sci.appendChild(sciP);card.appendChild(sci);
  const kt=el('div','takeaway');
  const ktLbl=el('div','takeaway-label');ktLbl.textContent='🎯  Key Takeaway';kt.appendChild(ktLbl);
  kt.appendChild(document.createTextNode(c.takeaway));card.appendChild(kt);
  const cta=el('button','btn btn-primary');cta.style.marginTop='24px';
  cta.textContent='→  Answer the Chapter Question';
  cta.onclick=()=>{STATE.screen='question';STATE.selectedOption=null;STATE.showFeedback=false;render();};card.appendChild(cta);
  if(STATE.chapterIndex>0){
    const back=el('button','btn btn-ghost');back.style.color='var(--text-dim)';
    back.textContent=`← Chapter ${STATE.chapterIndex}`;
    back.onclick=()=>{STATE.chapterIndex--;STATE.screen='chapter';render();};card.appendChild(back);
  }
  app.appendChild(card);app.appendChild(mkSaveNote());
}

function renderQuestion(app){
  const c=ch();const q=c.question;const card=el('div','question-card');
  const qlbl=el('div','q-label');qlbl.textContent=`${c.chapter} · Check Your Understanding`;card.appendChild(qlbl);
  const qtext=el('div','q-text');qtext.textContent=q.text;card.appendChild(qtext);
  const opts=el('div','options');
  q.options.forEach((opt,i)=>{
    const btn=el('button','option');
    if(STATE.showFeedback){if(opt.correct)btn.className+=' correct';else if(i===STATE.selectedOption)btn.className+=' wrong';btn.disabled=true;}
    else if(STATE.selectedOption===i)btn.className+=' selected';
    btn.textContent=opt.text;
    btn.onclick=()=>{if(STATE.showFeedback)return;STATE.selectedOption=i;render();};
    opts.appendChild(btn);
  });card.appendChild(opts);
  if(STATE.showFeedback){
    const isCorrect=q.options[STATE.selectedOption]?.correct;
    const fb=el('div',`feedback feedback-${isCorrect?'correct':'wrong'}`);
    const fbt=el('div','feedback-title');fbt.textContent=isCorrect?'✅  Correct!':'❌  Not quite.';fb.appendChild(fbt);
    const fbText=el('div');fbText.textContent=q.explanation;fb.appendChild(fbText);card.appendChild(fb);
    if(isCorrect){
      if(!done(c.id))STATE.completed.push(c.id);saveState(STATE);
      if(c.tryThis){
        const tt=el('div','try-this');
        const ttLbl=el('div','try-this-label');ttLbl.textContent='✋  Try This Before You Move On';tt.appendChild(ttLbl);
        const ttText=el('div','try-this-text');ttText.textContent=c.tryThis;tt.appendChild(ttText);card.appendChild(tt);
      }
      const isLast=STATE.chapterIndex===CHAPTERS.length-1;
      const next=el('button','btn btn-primary');
      next.textContent=isLast?'🎓  Get My Certificate':`→  Chapter ${STATE.chapterIndex+2}: ${CHAPTERS[STATE.chapterIndex+1].title}`;
      next.onclick=()=>{if(isLast){STATE.screen='complete';}else{STATE.chapterIndex++;STATE.screen='chapter';STATE.selectedOption=null;STATE.showFeedback=false;}render();};
      card.appendChild(next);
    }else{
      const row=el('div','btn-row');
      const retry=el('button','btn btn-ghost btn-sm');retry.textContent='↺  Try Again';
      retry.onclick=()=>{STATE.selectedOption=null;STATE.showFeedback=false;render();};row.appendChild(retry);
      const review=el('button','btn btn-secondary btn-sm');review.textContent='📖  Review Chapter';
      review.onclick=()=>{STATE.screen='chapter';STATE.selectedOption=null;STATE.showFeedback=false;render();};row.appendChild(review);
      card.appendChild(row);
    }
  }else{
    const check=el('button','btn btn-primary');check.textContent='Check';
    check.disabled=STATE.selectedOption===null;
    check.onclick=()=>{STATE.showFeedback=true;render();};card.appendChild(check);
    const goBack=el('button','btn btn-ghost');goBack.style.color='var(--text-dim)';goBack.textContent='← Review the Chapter';
    goBack.onclick=()=>{STATE.screen='chapter';render();};card.appendChild(goBack);
  }
  app.appendChild(card);app.appendChild(mkSaveNote());
}

  var cv=document.createElement('canvas');cv.className='confetti-canvas';ov.appendChild(cv);
  var inn=document.createElement('div');inn.className='celebration-inner';
  inn.innerHTML='<div class="celebration-check">✓</div><div class="celebration-title">Course Complete</div>';
  ov.appendChild(inn);document.body.appendChild(ov);
  requestAnimationFrame(function(){ov.style.opacity='1';});
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  var ctx=cv.getContext('2d');
  var cols=['#6E4ED6','#fff','#F5A623','#5BA88E','#7C5CFC','#E8D5FF','#FFC6D3'];
  var pts=Array.from({length:160},function(){return{
    x:Math.random()*cv.width,y:-20-Math.random()*200,
    rx:5+Math.random()*8,ry:2+Math.random()*5,
    d:1.5+Math.random()*2.5,color:cols[Math.floor(Math.random()*cols.length)],
    tilt:Math.random()*Math.PI*2,ts:.05+Math.random()*.12,spin:Math.random()*.4-.2
  };});
  var t0=performance.now(),raf;
  function draw(now){
    if(now-t0>3200){cancelAnimationFrame(raf);ctx.clearRect(0,0,cv.width,cv.height);return;}
    ctx.clearRect(0,0,cv.width,cv.height);
    pts.forEach(function(p){
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.tilt);
      ctx.beginPath();ctx.ellipse(0,0,p.rx,p.ry,0,0,Math.PI*2);
      ctx.fillStyle=p.color;ctx.fill();ctx.restore();
      p.y+=p.d;p.tilt+=p.ts;p.x+=p.spin;
      if(p.y>cv.height+20){p.y=-20;p.x=Math.random()*cv.width;}
    });
    raf=requestAnimationFrame(draw);
  }
  raf=requestAnimationFrame(draw);
  setTimeout(function(){
    ov.style.transition='opacity .65s ease';ov.style.opacity='0';
    setTimeout(function(){if(ov.parentNode)ov.parentNode.removeChild(ov);},700);
  },2500);
}

function renderComplete(app){

    progress['feeding'].cert=true;

    if(window.ffSync){window.ffSync.getUserId().then(uid=>{if(uid)window.ffSync.syncCert(uid,'feeding',STATE.completed);});}
  }catch(e){}

  // ── Celebration + achievement moment
  launchCelebration();

  // Achievement hero
  var hero=el('div','achievement-hero no-print');

  var hh=el('h2','achievement-headline');hh.innerHTML='You did the reading.<br><span>Most parents don\'t.</span>';hero.appendChild(hh);
  var hs=el('div','achievement-stats');

  const shareLabel=el('div','share-moment-label no-print');shareLabel.textContent='Share Your Achievement';app.appendChild(shareLabel);

  const seal=el('div','cert-seal');seal.textContent='✓';certOuter.appendChild(seal);
  const pretitle=el('div','cert-pretitle');pretitle.textContent='Certificate of Completion';certOuter.appendChild(pretitle);

  const nameWrap=el('div','cert-name-wrap');

  const nameDisplay=el('div','cert-name-input');nameDisplay.style.cursor='default';
  nameDisplay.textContent=userName()||'Your Name';nameWrap.appendChild(nameDisplay);certOuter.appendChild(nameWrap);
  certOuter.appendChild(el('div','cert-rule'));
  const body=el('div','cert-body');
  body.textContent="has successfully completed all 13 chapters of The Feeding Playbook, demonstrating understanding of research-backed approaches to infant and toddler nutrition across the milk phase, flavor window, and autonomy phase.";certOuter.appendChild(body);
  const sigRow=el('div','cert-sig-row');
  const sig=el('div','cert-sig');
  const sigLine=el('div','cert-sig-line');sig.appendChild(sigLine);
  const sigName=el('div','cert-sig-name');sigName.textContent='Jack Hartley';sig.appendChild(sigName);
  const sigRole=el('div','cert-sig-role');sigRole.textContent='Author, The Feeding Playbook';sig.appendChild(sigRole);
  sigRow.appendChild(sig);certOuter.appendChild(sigRow);
  const dateEl=el('div','cert-date');dateEl.textContent=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});certOuter.appendChild(dateEl);

  const siteUrl = el('div', 'cert-site-url');
  siteUrl.textContent = 'getfamilyforce.com';
  certOuter.appendChild(siteUrl);
  certCard.appendChild(certOuter);app.appendChild(certCard);

  const actions=el('div','card card-sm no-print');
  const copyBtn = el('button', 'btn btn-primary');
  copyBtn.textContent = '📋  Copy Certificate';
  copyBtn.onclick = async function() {
    const certEl = document.querySelector('.cert-outer');
    if (!certEl) return;
    copyBtn.textContent = 'Copying…'; copyBtn.disabled = true;
    try {
      const canvas = await html2canvas(certEl, { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false });
      canvas.toBlob(async function(blob) {
        try {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          copyBtn.textContent = '✓ Copied!';
        } catch (e) {
          const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
          a.download = 'familyforce-certificate.png'; a.click(); copyBtn.textContent = '✓ Saved!';
        }
        setTimeout(function() { copyBtn.textContent = '📋  Copy Certificate'; copyBtn.disabled = false; }, 2500);
      }, 'image/png');
    } catch(e) { copyBtn.textContent = 'Try again'; copyBtn.disabled = false; }
  };
  actions.appendChild(copyBtn);
    const epubBtn=el('button','btn btn-secondary');epubBtn.textContent='📄  Download Full Book';
  epubBtn.onclick=()=>{const a=document.createElement('a');a.href='assets/downloads/feeding-playbook.epub';a.download='Feeding-Playbook-Jack-Hartley.epub';a.click();};actions.appendChild(epubBtn);
  const dashBtn=el('button','btn btn-ghost');dashBtn.textContent='← Back to Dashboard';
  dashBtn.onclick=()=>{window.location.href='/scout-dashboard/library.html';};actions.appendChild(dashBtn);
  app.appendChild(actions);

  const actionCard=el('div','card no-print');
  const ae=el('div','eyebrow');ae.textContent='Your Action Plan';actionCard.appendChild(ae);
  const at=el('h3');at.style.marginTop='4px';at.textContent='13 things to try this week';actionCard.appendChild(at);
  const as_=el('p');as_.style.fontSize='13px';as_.style.marginTop='6px';as_.style.marginBottom='16px';
  as_.textContent='One specific action from each chapter. Pick the ones that match where you are right now.';actionCard.appendChild(as_);
  const list=el('div','action-list');
  CHAPTERS.forEach((c,i)=>{
    if(!c.tryThis)return;
    const item=el('div','action-item');
    const num=el('div','action-num');num.textContent=i+1;item.appendChild(num);
    const bdy=el('div','action-body');
    const clbl=el('div','action-chapter');clbl.textContent=`${c.icon} ${c.title}`;bdy.appendChild(clbl);
    const txt=el('div');txt.textContent=c.tryThis;bdy.appendChild(txt);item.appendChild(bdy);list.appendChild(item);
  });actionCard.appendChild(list);app.appendChild(actionCard);

  const rulesCard=el('div','card no-print');
  const re=el('div','eyebrow');re.textContent='The Core Principles';rulesCard.appendChild(re);
  const rt=el('h3');rt.style.marginTop='4px';rt.style.marginBottom='16px';rt.textContent='What the research reduces to';rulesCard.appendChild(rt);
  [
    ['🤱','Your job is to offer; the baby\'s job is to decide','Responsive feeding in the milk phase builds caloric self-regulation that lasts into childhood. Start here. This principle runs through every phase.'],
    ['🪟','Use the flavor window — it doesn\'t stay open','Between 6 and 12 months, the brain is maximally plastic for flavor acceptance. What you offer now determines what your toddler eats. Lead with iron. Include the bitter vegetables.'],
    ['🥜','Early allergens, not late ones','The LEAP trial settled this. Early introduction reduces allergy risk by up to 77%. Late introduction out of fear is what caused the allergy epidemic. Start before 6 months.'],
    ['🍽️','The family table is the method','Eat together, one food, screens off, no comments. Social modeling is the strongest lever available to parents of toddlers. Be boring about new foods. Stay boring.']
  ].forEach(([icon,title2,desc])=>{
    const rule=el('div','rule-item');
    const ri=el('div','rule-icon');ri.textContent=icon;rule.appendChild(ri);
    const rb=el('div');
    const rTitle=el('div','rule-title');rTitle.textContent=title2;rb.appendChild(rTitle);
    const rDesc=el('div','rule-desc');rDesc.textContent=desc;rb.appendChild(rDesc);
    rule.appendChild(rb);rulesCard.appendChild(rule);
  });app.appendChild(rulesCard);
}
