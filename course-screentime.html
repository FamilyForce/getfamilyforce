<style>
/* ─── TOKENS (matching site exactly) ─── */
:root {
  --sans:  'Outfit', system-ui, sans-serif;
  --serif: 'Instrument Serif', Georgia, serif;

  --terra:        #6E4ED6;
  --terra-dark:   #5B3CC4;
  --terra-light:  #9B80FF;
  --terra-tint:   #EDE9FB;
  --terra-tint2:  #F5F3FF;

  --bg:       #F8F7FF;
  --surface:  #FFFFFF;
  --elevated: #F3F0FF;

  --text:     #0D0820;
  --text-mid: #4A4560;
  --text-dim: #8B85A8;

  --border:       rgba(110,78,214,.12);
  --border-light: rgba(110,78,214,.07);

  --correct:     #22c55e;
  --correct-bg:  #F0FDF4;
  --correct-border: #86efac;
  --wrong:       #ef4444;
  --wrong-bg:    #FEF2F2;
  --wrong-border:#fca5a5;

  --radius-pill: 100px;
  --radius-card: 20px;
  --radius-sm:   12px;
  --shadow-card: 0 2px 16px rgba(110,78,214,.08);
  --ease:        cubic-bezier(.4,0,.2,1);
}

/* ─── RESET ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* Hide everything until auth confirmed */
html:not(.authed) body > * { visibility: hidden; }
html:not(.authed) .auth-loading { visibility: visible; }

/* ─── AUTH LOADING ─── */
.auth-loading {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  font-size: 14px; color: var(--text-dim); font-family: var(--sans);
}
html.authed .auth-loading { display: none; }

/* ─── HEADER ─── */
.course-header {
  position: sticky;
  top: 0; z-index: 100;
  background: rgba(248,247,255,.94);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-light);
  height: 60px;
  display: flex; align-items: center;
}
.header-inner {
  width: min(760px, 100% - 40px);
  margin-inline: auto;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px;
}
.header-logo {
  display: flex; align-items: center; gap: 8px;
  font-weight: 800; font-size: 16px; color: var(--text);
  text-decoration: none; flex-shrink: 0;
}
.logo-mark {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--terra); color: white;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800;
}
.header-back {
  font-size: 13px; font-weight: 600; color: var(--text-mid);
  text-decoration: none; display: flex; align-items: center; gap: 5px;
  transition: color .15s;
  flex-shrink: 0;
}
.header-back:hover { color: var(--terra); }
.header-course-name {
  font-size: 13px; font-weight: 600; color: var(--text-mid);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1; text-align: center;
}
@media (max-width: 480px) { .header-course-name { display: none; } }

/* ─── MAIN LAYOUT ─── */
.main {
  width: min(680px, 100% - 40px);
  margin-inline: auto;
  padding: 32px 0 80px;
}

/* ─── PROGRESS SECTION ─── */
.progress-section { margin-bottom: 28px; }
.progress-meta {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.progress-label { font-size: 12px; font-weight: 600; color: var(--text-dim); }
.progress-pct { font-size: 12px; font-weight: 700; color: var(--terra); }
.progress-bar-wrap {
  height: 5px; background: var(--terra-tint); border-radius: 99px;
  overflow: hidden; margin-bottom: 14px;
}
.progress-bar-fill {
  height: 100%; background: var(--terra); border-radius: 99px;
  transition: width .5s var(--ease);
}

/* ─── CHAPTER ROADMAP ─── */
.roadmap {
  display: flex; gap: 6px;
  overflow-x: auto; padding-bottom: 2px;
  scrollbar-width: none;
}
.roadmap::-webkit-scrollbar { display: none; }
.roadmap-ch {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  flex-shrink: 0; width: 64px; opacity: .35; transition: opacity .2s;
}
.roadmap-ch.done, .roadmap-ch.current { opacity: 1; }
.roadmap-icon {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--terra-tint);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; border: 2px solid transparent;
  position: relative; transition: all .2s; flex-shrink: 0;
}
.roadmap-ch.done .roadmap-icon {
  background: var(--correct-bg); border-color: var(--correct);
}
.roadmap-ch.done .roadmap-icon::after {
  content: '✓';
  position: absolute; bottom: -3px; right: -3px;
  width: 15px; height: 15px; background: var(--correct); color: white;
  border-radius: 50%; font-size: 9px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  line-height: 1;
}
.roadmap-ch.current .roadmap-icon {
  background: var(--terra-tint); border-color: var(--terra);
  box-shadow: 0 0 0 3px rgba(110,78,214,.15);
}
.roadmap-label {
  font-size: 10px; font-weight: 600; color: var(--text-dim);
  text-align: center; line-height: 1.3; max-width: 64px;
}
.roadmap-ch.current .roadmap-label { color: var(--terra); font-weight: 700; }
.roadmap-ch.done .roadmap-label { color: var(--text-mid); }

/* ─── CARDS ─── */
.card {
  background: var(--surface); border-radius: var(--radius-card);
  padding: 32px; box-shadow: var(--shadow-card);
  border: 1px solid var(--border-light);
  margin-bottom: 16px;
}
.card-sm { padding: 24px; }

/* ─── TYPOGRAPHY ─── */
.eyebrow {
  font-size: 11px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--terra); margin-bottom: 8px;
}
h1 {
  font-family: var(--serif); font-size: clamp(28px, 5vw, 36px);
  line-height: 1.15; color: var(--text); font-weight: 400;
}
h2 {
  font-family: var(--serif); font-size: clamp(22px, 4vw, 28px);
  line-height: 1.2; color: var(--text); font-weight: 400; margin-bottom: 6px;
}
h3 { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
p { font-size: 15px; line-height: 1.75; color: var(--text-mid); }
p + p { margin-top: 12px; }

.divider { height: 1px; background: var(--border-light); margin: 24px 0; }

/* ─── WELCOME ─── */
.welcome-badge {
  width: 72px; height: 72px; border-radius: 20px;
  background: var(--terra-tint); margin-bottom: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px;
}
.stat-row { display: flex; gap: 10px; margin: 24px 0; }
.stat-box {
  flex: 1; background: var(--terra-tint2); border-radius: var(--radius-sm);
  padding: 16px 10px; text-align: center;
  border: 1px solid var(--border-light);
}
.stat-num { font-size: 22px; font-weight: 800; color: var(--terra); }
.stat-lbl { font-size: 11px; color: var(--text-dim); margin-top: 3px; font-weight: 600; }
.how-step {
  display: flex; gap: 14px; align-items: flex-start; padding: 12px 0;
}
.how-step + .how-step { border-top: 1px solid var(--border-light); }
.step-num {
  width: 28px; height: 28px; border-radius: 50%; background: var(--terra);
  color: white; font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  margin-top: 2px;
}
.step-text { font-size: 15px; color: var(--text-mid); line-height: 1.55; }
.step-text strong { color: var(--text); }

/* ─── BUTTONS ─── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--sans); font-weight: 700; font-size: 15px;
  border: none; border-radius: var(--radius-pill);
  padding: 14px 28px; cursor: pointer; width: 100%;
  transition: background .2s, transform .15s, opacity .15s;
  text-decoration: none;
}
.btn-primary { background: var(--terra); color: white; }
@media (hover:hover) { .btn-primary:hover { background: var(--terra-dark); transform: translateY(-1px); } }
.btn-secondary {
  background: transparent; color: var(--terra-dark);
  border: 1.5px solid var(--terra);
}
@media (hover:hover) { .btn-secondary:hover { background: var(--terra-tint); } }
.btn-ghost { background: var(--terra-tint); color: var(--terra-dark); }
@media (hover:hover) { .btn-ghost:hover { background: var(--elevated); } }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none !important; }
.btn + .btn { margin-top: 10px; }
.btn-sm { font-size: 13px; padding: 10px 20px; width: auto; }
.btn-row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }

/* ─── JACK'S STORY ─── */
.story-block {
  border-left: 3px solid rgba(110,78,214,.3);
  padding: 18px 22px;
  margin: 22px 0;
  background: rgba(248,247,255,.7);
  border-radius: 0 12px 12px 0;
}
.story-label {
  font-size: 10px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--terra-light); margin-bottom: 10px;
}
.story-block p {
  font-style: italic; color: var(--text);
  font-size: 15px; line-height: 1.8;
}
.story-block p + p { margin-top: 12px; }

/* ─── SCIENCE BLOCK ─── */
.science-block {
  background: var(--terra-tint); border-radius: var(--radius-sm);
  padding: 18px 20px; margin: 18px 0;
}
.science-label {
  font-size: 10px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--terra); margin-bottom: 8px;
}
.science-block p { color: var(--text); font-style: normal; }

/* ─── KEY TAKEAWAY ─── */
.takeaway {
  background: var(--terra); color: white;
  border-radius: var(--radius-sm); padding: 16px 20px; margin: 18px 0;
  font-size: 14px; font-weight: 600; line-height: 1.6;
}
.takeaway-label {
  font-size: 10px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; opacity: .65; margin-bottom: 5px;
}

/* ─── QUESTION CARD ─── */
.question-card {
  background: var(--surface); border-radius: var(--radius-card);
  border-top: 3px solid var(--terra);
  padding: 28px; box-shadow: var(--shadow-card);
  border-left: 1px solid var(--border-light);
  border-right: 1px solid var(--border-light);
  border-bottom: 1px solid var(--border-light);
  margin-bottom: 16px;
}
.q-label {
  font-size: 11px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--terra); margin-bottom: 12px;
}
.q-text {
  font-size: 16px; font-weight: 600; line-height: 1.55;
  color: var(--text); margin-bottom: 4px;
}

/* ─── OPTIONS ─── */
.options { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
.option {
  border: 2px solid var(--border); border-radius: var(--radius-sm);
  padding: 14px 18px; cursor: pointer;
  font-size: 14px; line-height: 1.5; color: var(--text);
  background: var(--surface); text-align: left;
  transition: border-color .15s, background .15s;
  font-family: var(--sans); width: 100%;
}
@media (hover:hover) {
  .option:hover:not(:disabled) {
    border-color: var(--terra-light); background: var(--terra-tint);
  }
}
.option.selected {
  border-color: var(--terra); background: var(--terra-tint);
  color: var(--terra-dark); font-weight: 600;
}
.option.correct {
  border-color: var(--correct); background: var(--correct-bg);
  color: #15803d; font-weight: 600;
}
.option.wrong {
  border-color: var(--wrong); background: var(--wrong-bg); color: #b91c1c;
}
.option:disabled { cursor: default; }

/* ─── FEEDBACK ─── */
.feedback {
  border-radius: var(--radius-sm); padding: 16px 18px;
  font-size: 14px; line-height: 1.7; margin-top: 4px;
}
.feedback-correct { background: var(--correct-bg); border: 1px solid var(--correct-border); color: #166534; }
.feedback-wrong   { background: var(--wrong-bg);   border: 1px solid var(--wrong-border);   color: #991b1b; }
.feedback-title { font-weight: 700; margin-bottom: 4px; font-size: 15px; }

/* ─── TRY THIS ─── */
.try-this {
  border: 2px solid var(--correct); border-radius: var(--radius-sm);
  padding: 16px 18px; margin-top: 14px; background: var(--correct-bg);
}
.try-this-label {
  font-size: 10px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: #16a34a; margin-bottom: 6px;
}
.try-this-text { font-size: 14px; line-height: 1.65; color: #166534; font-weight: 500; }

/* ─── CERTIFICATE ─── */
.cert-outer {
  background: white;
  border: 2px solid var(--terra);
  border-radius: 20px;
  padding: clamp(28px, 6vw, 48px) clamp(24px, 6vw, 48px);
  text-align: center;
  position: relative;
  overflow: hidden;
}
.cert-outer::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at top, rgba(110,78,214,.05) 0%, transparent 60%);
  pointer-events: none;
}
.cert-seal {
  width: 80px; height: 80px; border-radius: 50%;
  background: var(--terra); margin: 0 auto 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; color: white;
  box-shadow: 0 6px 24px rgba(110,78,214,.3);
}
.cert-pretitle {
  font-size: 11px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px;
}
.cert-title {
  font-family: var(--serif); font-size: clamp(22px, 4vw, 30px);
  color: var(--text); margin-bottom: 20px; line-height: 1.2;
}
.cert-name-wrap { margin: 16px auto; max-width: 380px; }
.cert-name-label {
  font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600;
}
.cert-name-input {
  border: none; border-bottom: 2px solid var(--terra);
  background: transparent; font-family: var(--serif);
  font-size: 24px; color: var(--terra-dark); font-style: italic;
  text-align: center; width: 100%; padding: 6px 0; outline: none;
}
.cert-name-input::placeholder { color: var(--terra-tint); font-style: italic; }
.cert-rule { width: 80px; height: 2px; background: var(--terra-tint); margin: 22px auto; border-radius: 99px; }
.cert-body {
  font-size: 14px; color: var(--text-mid); line-height: 1.7;
  max-width: 420px; margin-inline: auto;
}
.cert-sig-row { display: flex; justify-content: center; margin-top: 32px; }
.cert-sig { text-align: center; }
.cert-sig-line { width: 130px; height: 1px; background: var(--border); margin: 0 auto 8px; }
.cert-sig-name { font-size: 15px; font-weight: 700; color: var(--text); }
.cert-sig-role { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.cert-date { font-size: 12px; color: var(--text-dim); margin-top: 22px; }
.cert-site-url { font-size: 11px; color: var(--text-ghost); margin-top: 8px; letter-spacing: 0.04em; }

/* ─── ACTION PLAN ─── */
.action-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.action-item {
  display: flex; align-items: flex-start; gap: 12px;
  background: var(--correct-bg); border: 1px solid var(--correct-border);
  border-radius: var(--radius-sm); padding: 12px 14px;
}
.action-num {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--correct); color: white; font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 1px;
}
.action-body { font-size: 14px; line-height: 1.55; color: #166534; }
.action-chapter { font-size: 11px; font-weight: 700; color: #16a34a; margin-bottom: 2px; }

/* ─── THREE RULES ─── */
.rule-item { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; }
.rule-item + .rule-item { border-top: 1px solid var(--border-light); }
.rule-icon { font-size: 22px; flex-shrink: 0; line-height: 1.4; }
.rule-body {}
.rule-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
.rule-desc { font-size: 14px; color: var(--text-mid); line-height: 1.55; }

/* ─── SAVE NOTE ─── */
.save-note {
  font-size: 12px; color: var(--text-dim); text-align: center;
  padding-top: 4px;
}

/* ─── FADE IN ─── */
.fade-in { animation: fadeIn .3s var(--ease); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ═══════════════════════════════════════════════════════════
   RESPONSIVE — TABLET (≤768px)
   ═══════════════════════════════════════════════════════════ */
@media (max-width: 768px) {
  /* Roadmap: larger touch targets */
  .roadmap { padding: 2px 2px 6px; scroll-padding-inline: 12px; gap: 8px; }
  .roadmap-icon { width: 40px; height: 40px; font-size: 18px; }
  .roadmap-ch { width: 68px; }
  .roadmap-label { font-size: 10px; max-width: 68px; }
}

/* ═══════════════════════════════════════════════════════════
   RESPONSIVE — MOBILE (≤480px)
   ═══════════════════════════════════════════════════════════ */
@media (max-width: 480px) {
  /* Layout */
  .main {
    width: calc(100% - 32px);
    padding-top: 24px;
    padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
  }

  /* Cards */
  .card { padding: 20px; border-radius: 16px; }
  .card-sm { padding: 16px; border-radius: 16px; }
  .question-card { padding: 20px; border-radius: 16px; }

  /* Progress */
  .progress-section { margin-bottom: 20px; }

  /* Welcome */
  .welcome-badge { width: 60px; height: 60px; font-size: 28px; border-radius: 16px; margin-bottom: 16px; }
  .stat-box { padding: 12px 8px; }
  .stat-num { font-size: 19px; }
  .stat-lbl { font-size: 10px; }
  .divider { margin: 18px 0; }
  .step-text { font-size: 14px; }

  /* Story + Science */
  .story-block { padding: 14px 16px; margin: 18px 0; }
  .story-block p { font-size: 14px; line-height: 1.75; }
  .science-block { padding: 14px 16px; }
  .science-block p { font-size: 14px; }
  .takeaway { padding: 14px 16px; font-size: 13px; }

  /* Question */
  .q-text { font-size: 15px; }
  .options { gap: 8px; margin: 16px 0; }
  .option { padding: 12px 14px; font-size: 14px; }

  /* Feedback + Try This */
  .feedback { padding: 14px 16px; font-size: 14px; }
  .feedback-title { font-size: 14px; }
  .try-this { padding: 14px 16px; }
  .try-this-text { font-size: 13px; }

  /* Buttons — btn-row stacks vertically */
  .btn-row { flex-direction: column; gap: 8px; }
  .btn-row .btn { width: 100%; }
  .btn-sm { font-size: 14px; padding: 12px 20px; }

  /* Certificate */
  .cert-name-input { font-size: 20px; }
  .cert-body { font-size: 13px; }
  .cert-sig-row { margin-top: 24px; }

  /* Action plan */
  .action-item { padding: 10px 12px; }
  .action-body { font-size: 13px; }
  .action-chapter { font-size: 10px; }

  /* Three Rules */
  .rule-title { font-size: 14px; }
  .rule-desc { font-size: 13px; }
}

const SAVE_KEY = 'ff_course_screentime_v1';

function loadState() {
  try { const s = localStorage.getItem(SAVE_KEY); if (s) return JSON.parse(s); } catch(e) {}
  return null;
}
function saveState(s) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch(e) {}
  // Sync state to Supabase (debounced 4s, fire-and-forget)
  if (window.ffSync) {
    window.ffSync.getUserId().then(uid => {
      if (uid) window.ffSync.syncState(uid, 'screen-time', s);
    });
  }
}

function freshState() {
  return {
    screen: 'welcome',
    chapterIndex: 0,
    completed: [],
    selectedOption: null,
    showFeedback: false,
  };
}

let STATE = loadState() || freshState();

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════

function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}
function ch() { return CHAPTERS[STATE.chapterIndex]; }
function done(id) { return STATE.completed.includes(id); }
function totalDone() { return STATE.completed.length; }
function pct() { return Math.round((totalDone() / CHAPTERS.length) * 100); }
function userName() { return localStorage.getItem('ff_user_name') || window._sbUserEmail || ''; }

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════

function render() {
  saveState(STATE);
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.className = 'fade-in';

  // Progress bar + roadmap (not on welcome or complete)
  if (STATE.screen === 'chapter' || STATE.screen === 'question') {
    renderProgress(app);
  }

  switch (STATE.screen) {
    case 'welcome':  renderWelcome(app);  break;
    case 'chapter':  renderChapter(app);  break;
    case 'question': renderQuestion(app); break;
    case 'complete': renderComplete(app); break;
  }
}

// ═══════════════════════════════════════════════════════════

function renderProgress(app) {
  const wrap = el('div', 'progress-section no-print');

  // Bar
  const meta = el('div', 'progress-meta');
  const lbl = el('span', 'progress-label');
  lbl.textContent = `Chapter ${STATE.chapterIndex + 1} of ${CHAPTERS.length}`;
  const pctLbl = el('span', 'progress-pct');
  pctLbl.textContent = pct() + '% complete';
  meta.appendChild(lbl); meta.appendChild(pctLbl);
  wrap.appendChild(meta);

  const barWrap = el('div', 'progress-bar-wrap');
  const fill = el('div', 'progress-bar-fill');
  fill.style.width = pct() + '%';
  barWrap.appendChild(fill);
  wrap.appendChild(barWrap);

  // Roadmap
  const roadmap = el('div', 'roadmap');
  CHAPTERS.forEach((c, i) => {
    const isDone    = done(c.id);
    const isCurrent = i === STATE.chapterIndex;
    const chip = el('div', 'roadmap-ch' + (isDone ? ' done' : isCurrent ? ' current' : ''));

    const icon = el('div', 'roadmap-icon'); icon.textContent = c.icon;
    chip.appendChild(icon);

    const lbl = el('div', 'roadmap-label');
    lbl.textContent = (c.short || c.title).replace('\n', ' ');
    lbl.title = c.title;
    chip.appendChild(lbl);

    roadmap.appendChild(chip);
  });
  wrap.appendChild(roadmap);

  // Scroll current into view
  setTimeout(() => {
    const chips = roadmap.querySelectorAll('.roadmap-ch');
    if (chips[STATE.chapterIndex]) {
      chips[STATE.chapterIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
  }, 60);

  app.appendChild(wrap);
}

function renderQuestion(app) {
  const c = ch();
  const q = c.question;

  const card = el('div', 'question-card');

  const qlbl = el('div', 'q-label');
  qlbl.textContent = `${c.chapter} · Check Your Understanding`;
  card.appendChild(qlbl);

  const qtext = el('div', 'q-text'); qtext.textContent = q.text;
  card.appendChild(qtext);

  // Options
  const opts = el('div', 'options');
  q.options.forEach((opt, i) => {
    const btn = el('button', 'option');
    if (STATE.showFeedback) {
      if (opt.correct) btn.className += ' correct';
      else if (i === STATE.selectedOption) btn.className += ' wrong';
      btn.disabled = true;
    } else if (STATE.selectedOption === i) {
      btn.className += ' selected';
    }
    btn.textContent = opt.text;
    btn.onclick = () => {
      if (STATE.showFeedback) return;
      STATE.selectedOption = i;
      render();
    };
    opts.appendChild(btn);
  });
  card.appendChild(opts);

  if (STATE.showFeedback) {
    const isCorrect = q.options[STATE.selectedOption]?.correct;

    // Feedback
    const fb = el('div', `feedback feedback-${isCorrect ? 'correct' : 'wrong'}`);
    const fbt = el('div', 'feedback-title');
    fbt.textContent = isCorrect ? '✅  Correct!' : '❌  Not quite.';
    fb.appendChild(fbt);
    const fbText = el('div'); fbText.textContent = q.explanation;
    fb.appendChild(fbText);
    card.appendChild(fb);

    if (isCorrect) {
      // Mark complete
      if (!done(c.id)) STATE.completed.push(c.id);
      saveState(STATE);

      // Try This
      if (c.tryThis) {
        const tt = el('div', 'try-this');
        const ttLbl = el('div', 'try-this-label'); ttLbl.textContent = '✋  Try This Before You Move On';
        tt.appendChild(ttLbl);
        const ttText = el('div', 'try-this-text'); ttText.textContent = c.tryThis;
        tt.appendChild(ttText);
        card.appendChild(tt);
      }

      const isLast = STATE.chapterIndex === CHAPTERS.length - 1;
      const next = el('button', 'btn btn-primary');
      next.textContent = isLast
        ? '🎓  Get My Certificate'
        : `→  Chapter ${STATE.chapterIndex + 2}: ${CHAPTERS[STATE.chapterIndex + 1].title}`;
      next.onclick = () => {
        if (isLast) {
          STATE.screen = 'complete';
        } else {
          STATE.chapterIndex++;
          STATE.screen = 'chapter';
          STATE.selectedOption = null;
          STATE.showFeedback = false;
        }
        render();
      };
      card.appendChild(next);

    } else {
      // Wrong — retry or review
      const row = el('div', 'btn-row');

      const retry = el('button', 'btn btn-ghost btn-sm');
      retry.textContent = '↺  Try Again';
      retry.onclick = () => { STATE.selectedOption = null; STATE.showFeedback = false; render(); };
      row.appendChild(retry);

      const review = el('button', 'btn btn-secondary btn-sm');
      review.textContent = '📖  Review Chapter';
      review.onclick = () => { STATE.screen = 'chapter'; STATE.selectedOption = null; STATE.showFeedback = false; render(); };
      row.appendChild(review);

      card.appendChild(row);
    }

  } else {
    // Check button
    const check = el('button', 'btn btn-primary');
    check.textContent = 'Check';
    check.disabled = STATE.selectedOption === null;
    check.onclick = () => { STATE.showFeedback = true; render(); };
    card.appendChild(check);

    const goBack = el('button', 'btn btn-ghost');
    goBack.style.color = 'var(--text-dim)';
    goBack.textContent = '← Review the Chapter';
    goBack.onclick = () => { STATE.screen = 'chapter'; render(); };
    card.appendChild(goBack);
  }

  app.appendChild(card);
  app.appendChild(mkSaveNote());
}

function launchCelebration(){
  var ov=document.createElement('div');ov.className='celebration-overlay';
  var cv=document.createElement('canvas');cv.className='confetti-canvas';ov.appendChild(cv);
  var inn=document.createElement('div');inn.className='celebration-inner';
  inn.innerHTML='<div class="celebration-check">✓</div><div class="celebration-title">Course Complete</div>';
  ov.appendChild(inn);document.body.appendChild(ov);
  requestAnimationFrame(function(){ov.style.opacity='1';});
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  var ctx=cv.getContext('2d');
  var cols=['#6E4ED6','#fff','#F5A623','#5BA88E','#7C5CFC','#E8D5FF','#FFC6D3'];
  var pts=Array.from({length:160},function(){return{
    x:Math.random()*cv.width,y:-20-Math.random()*200,
    rx:5+Math.random()*8,ry:2+Math.random()*5,
    d:1.5+Math.random()*2.5,color:cols[Math.floor(Math.random()*cols.length)],
    tilt:Math.random()*Math.PI*2,ts:.05+Math.random()*.12,spin:Math.random()*.4-.2
  };});
  var t0=performance.now(),raf;
  function draw(now){
    if(now-t0>3200){cancelAnimationFrame(raf);ctx.clearRect(0,0,cv.width,cv.height);return;}
    ctx.clearRect(0,0,cv.width,cv.height);
    pts.forEach(function(p){
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.tilt);
      ctx.beginPath();ctx.ellipse(0,0,p.rx,p.ry,0,0,Math.PI*2);
      ctx.fillStyle=p.color;ctx.fill();ctx.restore();
      p.y+=p.d;p.tilt+=p.ts;p.x+=p.spin;
      if(p.y>cv.height+20){p.y=-20;p.x=Math.random()*cv.width;}
    });
    raf=requestAnimationFrame(draw);
  }
  raf=requestAnimationFrame(draw);
  setTimeout(function(){
    ov.style.transition='opacity .65s ease';ov.style.opacity='0';
    setTimeout(function(){if(ov.parentNode)ov.parentNode.removeChild(ov);},700);
  },2500);
}

  const sigRow = el('div', 'cert-sig-row');
  const sig = el('div', 'cert-sig');
  const sigLine = el('div', 'cert-sig-line'); sig.appendChild(sigLine);
  const sigName = el('div', 'cert-sig-name'); sigName.textContent = 'Jack Hartley'; sig.appendChild(sigName);
  const sigRole = el('div', 'cert-sig-role'); sigRole.textContent = 'Author, The Screen Time Playbook'; sig.appendChild(sigRole);
  sigRow.appendChild(sig);
  certOuter.appendChild(sigRow);

  const dateEl = el('div', 'cert-date');
  dateEl.textContent = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  certOuter.appendChild(dateEl);

  const siteUrl = el('div', 'cert-site-url');
  siteUrl.textContent = 'getfamilyforce.com';
  certOuter.appendChild(siteUrl);

  certCard.appendChild(certOuter);
  app.appendChild(certCard);

  // Print + PDF actions
  const actions = el('div', 'card card-sm no-print');

  const copyBtn = el('button', 'btn btn-primary');
  copyBtn.textContent = '📋  Copy Certificate';
  copyBtn.onclick = async function() {
    const certEl = document.querySelector('.cert-outer');
    if (!certEl) return;
    copyBtn.textContent = 'Copying…';
    copyBtn.disabled = true;
    try {
      const canvas = await html2canvas(certEl, {
        scale: 2,
        useCORS: true,
        backgroundColor: '#ffffff',
        logging: false,
      });
      canvas.toBlob(async function(blob) {
        try {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          copyBtn.textContent = '✓ Copied!';
        } catch (e) {
          // Clipboard write blocked (Firefox, non-HTTPS) — fallback to download
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'familyforce-certificate.png';
          a.click();
          copyBtn.textContent = '✓ Saved!';
        }
        setTimeout(function() {
          copyBtn.textContent = '📋  Copy Certificate';
          copyBtn.disabled = false;
        }, 2500);
      }, 'image/png');
    } catch(e) {
      copyBtn.textContent = 'Try again';
      copyBtn.disabled = false;
    }
  };
  actions.appendChild(copyBtn);

  const pdfBtn = el('button', 'btn btn-secondary');
  pdfBtn.textContent = '📄  Download Full Book';
  pdfBtn.onclick = () => {
    const a = document.createElement('a');
    a.href = 'assets/downloads/screen-time-playbook.epub';
    a.download = 'Screen-Time-Playbook-Jack-Hartley.epub';
    a.click();
  };
  actions.appendChild(pdfBtn);

  const dashBtn = el('button', 'btn btn-ghost');
  dashBtn.textContent = '← Back to Dashboard';
  dashBtn.onclick = () => { window.location.href = 'dashboard.html'; };
  actions.appendChild(dashBtn);

  app.appendChild(actions);

  // Action Plan
  const actionCard = el('div', 'card no-print');
  const ae = el('div', 'eyebrow'); ae.textContent = 'Your Action Plan';
  actionCard.appendChild(ae);
  const at = el('h3'); at.style.marginTop = '4px'; at.textContent = '11 things to try this week';
  actionCard.appendChild(at);
  const as_ = el('p'); as_.style.fontSize = '13px'; as_.style.marginTop = '6px'; as_.style.marginBottom = '16px';
  as_.textContent = 'One specific action from each chapter. Pick the ones that matter most for where you are right now.';
  actionCard.appendChild(as_);

  const list = el('div', 'action-list');
  CHAPTERS.forEach((c, i) => {
    if (!c.tryThis) return;
    const item = el('div', 'action-item');
    const num = el('div', 'action-num'); num.textContent = i + 1; item.appendChild(num);
    const body = el('div', 'action-body');
    const clbl = el('div', 'action-chapter'); clbl.textContent = `${c.icon} ${c.title}`; body.appendChild(clbl);
    const txt = el('div'); txt.textContent = c.tryThis; body.appendChild(txt);
    item.appendChild(body);
    list.appendChild(item);
  });
  actionCard.appendChild(list);
  app.appendChild(actionCard);

  // Three Rules
  const rulesCard = el('div', 'card no-print');
  const re = el('div', 'eyebrow'); re.textContent = 'The Three Rules';
  rulesCard.appendChild(re);
  const rt = el('h3'); rt.style.marginTop = '4px'; rt.style.marginBottom = '16px';
  rt.textContent = 'The framework behind everything in this course';
  rulesCard.appendChild(rt);

  [
    ['🚫', 'Contingency', 'Never use screens to stop tantrums. Build the emotional regulation skill instead of bypassing it.'],
    ['📺', 'Quality', 'Slow-paced, language-rich content. Under 3 scene cuts per minute. You choose it. You watch it with them.'],
    ['⏰', 'Timing', "No screens before meals, sleep, or outdoor play. These are what screens displace — and they're what matter most."]
  ].forEach(([icon, title, desc]) => {
    const rule = el('div', 'rule-item');
    const ri = el('div', 'rule-icon'); ri.textContent = icon; rule.appendChild(ri);
    const rb = el('div', 'rule-body');
    const rTitle = el('div', 'rule-title'); rTitle.textContent = title; rb.appendChild(rTitle);
    const rDesc = el('div', 'rule-desc'); rDesc.textContent = desc; rb.appendChild(rDesc);
    rule.appendChild(rb);
    rulesCard.appendChild(rule);
  });
  app.appendChild(rulesCard);
}

// ═══════════════════════════════════════════════════════════

function mkSaveNote() {
  const n = el('p', 'save-note no-print');
  n.textContent = '✓  Progress saved automatically';
  return n;
}

// ═══════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════
render();
</script>
