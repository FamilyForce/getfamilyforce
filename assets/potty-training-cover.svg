<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 680" width="480" height="680" role="img" aria-label="The Potty Training Playbook cover">
  <!-- Background -->
  <rect x="0" y="0" width="480" height="680" fill="#1A1433"/>

  <!-- Top section: dark -->
  <rect x="0" y="0" width="480" height="272" fill="#1A1433"/>

  <!-- Bottom section: white -->
  <rect x="0" y="272" width="480" height="408" fill="#FFFFFF"/>

  <!-- Thin purple border frame -->
  <rect x="14" y="14" width="452" height="652" fill="none" stroke="#7C5CFC" stroke-width="1.5"/>

  <!-- ── TOP SECTION ── -->

  <!-- THE -->
  <text
    x="240" y="68"
    font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif"
    font-size="13" font-weight="600"
    letter-spacing="8"
    fill="#FFFFFF" opacity="0.85"
    text-anchor="middle"
  >THE</text>

  <!-- Potty -->
  <text
    x="240" y="162"
    font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif"
    font-size="80" font-weight="700"
    fill="#FFFFFF"
    text-anchor="middle"
  >Potty</text>

  <!-- Training -->
  <text
    x="240" y="248"
    font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif"
    font-size="80" font-weight="700"
    fill="#FFFFFF"
    text-anchor="middle"
  >Training</text>

  <!-- ── BOTTOM SECTION ── -->

  <!-- PLAYBOOK -->
  <text
    x="240" y="326"
    font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif"
    font-size="22" font-weight="700"
    letter-spacing="10"
    fill="#1A1433"
    text-anchor="middle"
  >PLAYBOOK</text>

  <!-- Divider line under PLAYBOOK -->
  <line x1="190" y1="338" x2="290" y2="338" stroke="#6E4ED6" stroke-width="1.5"/>

  <!-- Subtitle line 1 -->
  <text
    x="240" y="382"
    font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif"
    font-size="13.5"
    fill="#6B6878"
    text-anchor="middle"
  >A research-backed guide for parents</text>

  <!-- Subtitle line 2 -->
  <text
    x="240" y="402"
    font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif"
    font-size="13.5"
    fill="#6B6878"
    text-anchor="middle"
  >who are ready to be done with diapers</text>

  <!-- Spacer line before author -->
  <line x1="200" y1="570" x2="280" y2="570" stroke="#DDDAE8" stroke-width="1"/>

  <!-- JACK HARTLEY -->
  <text
    x="240" y="606"
    font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif"
    font-size="14" font-weight="700"
    letter-spacing="4"
    fill="#1A1433"
    text-anchor="middle"
  >JACK HARTLEY</text>

  <!-- Dad of Two -->
  <text
    x="240" y="626"
    font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif"
    font-size="12" font-weight="300"
    fill="#9B97AE"
    text-anchor="middle"
  >Dad of Two</text>

  <!-- Publisher -->
  <text
    x="240" y="654"
    font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif"
    font-size="10" font-weight="300"
    letter-spacing="1"
    fill="#C2BFD0"
    text-anchor="middle"
  >FamilyForce Publishing · familyforce.com</text>
</svg>
